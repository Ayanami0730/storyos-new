rules:
  - No supernatural elements; the story is realistic.
  - "Social hierarchy is enforced: marriages between nobility and servants are
    forbidden; the lord arranges alliances for lineage."
  - Physical evidence (the objects listed) is admissible and must be handled
    consistently across scenes.
  - Characters' ages and relations as stated are fixed.
  - "No deus ex machina reversals: sentences or irreversible outcomes cannot be
    undone unless earlier foreshadowed."
