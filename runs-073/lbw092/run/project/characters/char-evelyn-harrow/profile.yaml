id: char-evelyn-harrow
name: evelyn-harrow
sketch: Lord Harrow's only daughter, 19. Gentle, curious, privately rebellious;
  finds solace in the orchard and in small acts of kindness.
identity:
  appearance: Keeps her skirts shallow from the soil; sits on the orchard bench to
    take the sun.
  speech: careful and folded; keeps certain things private
