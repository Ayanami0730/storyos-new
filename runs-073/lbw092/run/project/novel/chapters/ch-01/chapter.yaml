      - obj-seal-ring
      - obj-love-letters
      - obj-rose-locket
  - id: s-004
    intent: "Tragic resolution and aftermath: Punishment (execution, exile, or other
      irreversible sentence) is carried out. Evelyn's protest culminates in a
      desperate act—either suicide or a self-sacrificial gesture—that seals the
      lovers' fate. The manor's cold logic and the ruin left behind are shown;
      small symbols (the locket, the unread letters) mark the loss."
