chapter: ch-01
scenes:
  - id: s-001
    intent: "Meeting and token: Evelyn slips into the orchard to escape court life;
      she meets Thomas by chance. Their conversation is tentative and intimate;
      Evelyn gives Thomas the silver rose locket as a private token. Establishes
      class boundaries, orchard as sanctuary, and the lovers' first secret."
    present:
      - char-evelyn-harrow
      - char-thomas-byrd
      - loc-orchard
      - obj-rose-locket
  - id: s-002
    intent: "Secret courtship: Thomas and Evelyn deepen their intimacy with stolen
      afternoons in the orchard and exchanged letters. In the kitchen and
      cellars their furtive movements attract Mistress Anne's attention; small
      slips (a missing apron, a glimpse at the orchard wall) raise household
      tension. The lovers' bond and the risks become vivid."
    present:
      - char-evelyn-harrow
      - char-thomas-byrd
      - char-mistress-anne-fletcher
      - loc-kitchen-cellars
      - loc-orchard
      - obj-love-letters
      - obj-rose-locket
  - id: s-003
    intent: "Discovery and accusation: Lord Harrow's signet ring surfaces where
      Thomas can be tied to it; either found among his effects or presented as
      evidence. The manor convenes a hearing in the great hall/chapel. Evelyn
      must choose between confession and protecting Thomas; Lord Harrow insists
      on honour and the house's law. The scene hinges on the seal ring, the
      letters, and the social consequences."
    present:
      - char-lord-harrow
      - char-evelyn-harrow
      - char-thomas-byrd
      - char-mistress-anne-fletcher
      - char-lady-margaret-stone
      - loc-harrow-manor
