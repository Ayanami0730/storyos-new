  - id: s-002
    chapter: ch-01
    intent: Aldo searches the study and the house with Inspector Rao, inspects the
      mantel and hearth, finds the hidden cavity and the clockwork device,
      notices the oil staining and the distinct file nick; interrogations of
      Henry, Marta and Derek establish conflicting alibis and motives (the
      ledger, debts, a recent angry conversation). The ladder is spotted outside
      and the coal-hatch's abrasion is recorded.
