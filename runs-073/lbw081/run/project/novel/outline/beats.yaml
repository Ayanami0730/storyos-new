  - id: s-003
    chapter: ch-01
    intent: "Aldo reconstructs possibilities, tests the clockwork, examines the
      watch more closely (puncture and oil), deciphers the scrap of paper enough
      to show it was a schedule, and sees the temporal mismatch: the watch's
      stopped time matches when the device would have fired. He narrows the
      method: a timed push-rod raised through the floor from the cellar, driven
      by a wound clockwork hidden under the hearth. Tension rises as one
      suspect's alibi fractures."
