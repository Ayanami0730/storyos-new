scenes:
  - id: s-001
    chapter: ch-01
    intent: "Open on the locked-room: Aldo arrives at Crane Manor, examines the
      sealed study and the body, sets the puzzle (locked deadbolt, latched
      window, watch stopped at 9:07, wax flake, machine-oil smell). Introduce
      characters and simmering motive threads (Henry's grief, Marta's
      protectiveness, Derek's odd presence next door). Plant the clues that will
      matter later."
