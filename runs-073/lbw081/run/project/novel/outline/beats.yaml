  - id: s-004
    chapter: ch-01
    intent: "Confrontation and demonstration: Aldo brings the parties to the study
      and runs a live re-creation with Inspector Rao, showing how the mechanism,
      the ladder, the hatch and the waxed note fit Derek's workshop habits and
      motives. The murderer is exposed; after a last desperate lunge (brief
      suspense), a confession and the forensic tie (the file nick and wax
      impression) close the case. End with Aldo reflecting on the thin line
      between invention and weaponry."
