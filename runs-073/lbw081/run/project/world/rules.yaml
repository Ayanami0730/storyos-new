note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - No supernatural solutions or unexplained actions; the locked-room must be
    resolved by physical mechanism, misdirection, or human action consistent
    with the environment.
  - All clues relied on in the solution must be introduced to the reader (or the
    narrator) before the reveal scene and have identifiable provenance.
  - Times, locations and physical traces must be internally consistent (the
    watch's stopped time, hatch abrasions, ladder marks, oil stains and filing
    nick must align with the clockwork reconstruction).
  - Forensic detail may be stylised but must not violate basic plausibility (no
    instantaneous chemical transformations, no impossible mechanical feats).
  - The narrator (Aldo) is a competent, essentially reliable detective; he may
    withhold interpretation but not facts.
  - No later scene may introduce new characters, locations, or significant
    objects not listed above without explicitly adding them to the index with
    provenance.
