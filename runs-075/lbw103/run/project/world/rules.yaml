note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "Transmission: the virus spreads only via direct bites or contact between
    infected blood and an open wound. Saliva alone without break in skin is not
    reliable transmission."
  - "Kill rule: an infected host stops moving only when the brain is destroyed
    or irreparably damaged. Torso or limb destruction alone does not stop
    motion."
  - "Incubation and timeline: symptoms appear within 2–6 hours of exposure;
    collapse to violent, disoriented aggression follows quickly. The outbreak
    escalates from quiet to town-wide within a day."
  - "Behavior: the infected are drawn to loud noises and sudden movement. They
    show no planning, forethought, or tool use — purely stimulus-driven
    aggression."
  - "No cure, no supernatural: there is no miraculous immunity, cure, or
    resurrection. Bodies do not reanimate after being truly destroyed (brain
    destroyed)."
  - "Resources are limited: fuel, ammunition and medicine are scarce; scavenging
    is risky. Vehicles need fuel and basic mechanical function to move; the
    truck can be jury-rigged but not made into something it is not."
