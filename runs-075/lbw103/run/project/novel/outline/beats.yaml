      - obj-journal
    target_words: 1250
  - id: s-002
    chapter: ch-01
    intent: A hospital run to grab medicine and morphine for wounded or sedating,
      and an attempted reconnaissance toward the old bridge. The group faces
      their first close-quarters fight in the ER, Otto is exposed and later
      bitten; the bridge is found blocked/collapsed, forcing a reroute to the
      rail yard. Ellie uses mechanical skill to jury-rig the truck for the
      coming run.
    present:
      - char-ellie
      - char-otto
      - char-maya
      - char-lina
      - loc-hospital
      - loc-old-bridge
