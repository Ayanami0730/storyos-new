  - id: s-004
    chapter: ch-01
    intent: "Final desperate sprint to the highway at dawn. The town is a chorus of
      groans; the truck must punch through a blockade of cars and a spreading
      horde. Ellie stages a last stand: she rigs a diversion, gives the
      survivors a path, and fights until she's overwhelmed. The story ends in
      first person with Ellie's last notebook entry as Dan and Maya's brakes
      squeal away on the highway."
