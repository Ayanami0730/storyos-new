scenes:
  - id: s-001
    chapter: ch-01
    intent: "Open in medias res: the outbreak's first day. Establish Ellie's voice
      and relationships as the town shutters down. The group coalesces at the
      gas station where they salvage fuel and a radio, debate routes and resolve
      to head for the highway. Small discoveries set the stakes: limited gas,
      noisy hordes attracted to sound, and the old bridge's fragility noted on
      the map."
