    target_words: 1250
  - id: s-003
    chapter: ch-01
    intent: Nightfall drives the group through the exposed rail yard toward the
      riverbank to try to skirt the bridge. Tension and limited visibility cause
      mistakes; Lina panics and is killed, and the group's cohesion frays. Ellie
      improvises with the flare and pickaxe; a bitter choice is made to abandon
      Otto and push for the highway at first light.
    present:
