scenes:
  - id: s-001
    chapter: ch-01
    intent: "Establish voice and setting: first-person narrator returns to
      loc-hollow-house to empty the rooms and catalogue what was left. Introduce
      obj-obsidian-mirror and obj-locked-trunk in loc-attic, the scent and
      optics of the house that make perception unreliable. Show loc-kitchen
      where obj-music-box is found on the sideboard. Close with the first
      uncanny detail — the music box winding itself faintly downstairs — that
      turns a sad house into an inhabited one."
    present:
      - char-rowan
      - loc-hollow-house
      - loc-attic
      - loc-kitchen
      - obj-obsidian-mirror
      - obj-locked-trunk
      - obj-music-box
      - char-mrs-harper
    target_words: 625
  - id: s-002
    chapter: ch-01
    intent: "Escalate supernatural logic and stakes: in loc-attic the narrator finds
      obj-journal and, tucked into it, obj-brass-key. Reading the child's
      handwriting establishes char-margaret-ghost's voice and a concrete
      instruction: a named ritual, a place and an object (the shallow well in
      loc-basement and the lullaby). The mirror shows a displaced reflection —
      the house as it was — and the music box plays on its own, synchronising
      past and present. The scene lays out how the ghost interacts with objects
      and memories."
    present:
      - char-rowan
      - loc-attic
      - obj-journal
      - obj-brass-key
      - obj-obsidian-mirror
      - obj-music-box
      - char-margaret-ghost
      - loc-basement
    target_words: 625
  - id: s-003
    chapter: ch-01
    intent: "Pressure and confession: a coastal storm closes off loc-driveway and
      cuts power. The trunk is opened with obj-brass-key; obj-photo-1958 is
      revealed and triggers gaps in char-rowan's memory. char-mrs-harper appears
      briefly with evasions that point to a cover-up. The house increasingly
      acts with intent — pipes, lights and the music box punctuate reading — and
      the narrator is forced to confront the possibility that their missing
      memory is a wound someone else tended to hide."
    present:
      - char-rowan
      - char-mrs-harper
      - char-margaret-ghost
      - loc-basement
      - loc-driveway
      - obj-locked-trunk
      - obj-photo-1958
      - obj-music-box
      - obj-journal
      - obj-brass-key
    target_words: 625
  - id: s-004
    chapter: ch-01
    intent: "Confrontation and payoff: in loc-attic by the obj-obsidian-mirror the
      narrator attempts to perform or refuse the child's instruction from
      obj-journal (an act whose mechanics are described there).
      char-margaret-ghost forces a full replay of the final day — precise,
      sensory and unavoidable — through mirror/reflection and the music box. The
      narrator either makes the ritual move that frees the ghost at the cost of
      something essential, or fails and becomes bound. The scene ends with a
      final, logically consistent consequence that resolves the ghost's claim
      and leaves the reader with the terrifying cost."
    present:
      - char-rowan
      - char-margaret-ghost
      - loc-attic
      - obj-obsidian-mirror
      - obj-journal
      - obj-music-box
      - obj-locked-trunk
    target_words: 625
