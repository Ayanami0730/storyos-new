note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - Ghosts are bound to loc-hollow-house and to specific objects
    (obj-obsidian-mirror, obj-locked-trunk, obj-music-box, obj-journal); they
    cannot leave the property unless the ritual in obj-journal is completed
    exactly as written.
  - The obj-obsidian-mirror can show displaced reflections (the house's past or
    replays) only when triggered by an emotional or object-based mnemonic (the
    obj-music-box, a written instruction in obj-journal, or direct address by
    the narrator). It does not grant knowledge beyond those replays.
  - Memory gaps are sealed wounds. They can only be reopened by the ritual
    described in obj-journal, and that reopening manifests as an uncontrollable,
    sensory replay rather than a gradual remembering.
  - "Mechanical objects behave according to physical logic except where
    specified: the obj-music-box can wind and play under the house's agency, but
    humans cannot be animated by it and weather (storms) follows realistic
    constraints (roads flood, power fails)."
  - The ritual in obj-journal has precise, literal steps and a cost; its
    efficacy is deterministic within the story. If the narrator follows it,
    certain material consequences occur (a ghost freed, or an exchange) and
    these consequences are consistent and irreversible.
  - "No deus ex machina: no new supernatural rules or entities appear after the
    plan is submitted. All manifestations must follow the rules above and be
    motivated by items and relationships introduced in these entities."
