note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "No supernatural magic: imaginative transformations are metaphor and shared
    play that change how characters perceive events, not physical reality (e.g.,
    a creek is still a creek)."
  - Characters' ages, relationships and basic facts must remain consistent
    across scenes (Eli = 12, Mara = 12, Finn = 7; Eli and Finn are siblings;
    Mara is Eli's friend).
  - "Time flows realistically: the trip must fit a school morning's timeline;
    actions (walking, talking, rigging rope) take plausible amounts of time."
  - "Consequences are real: injuries, lateness, or scolds can happen; bravery
    does not exempt characters from ordinary results."
  - All objects and locations introduced here are available for use later; no
    new characters, locations, or significant objects may be introduced without
    adding them to the index first.
