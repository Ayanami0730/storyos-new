scenes:
  - id: s-001
    chapter: ch-01
    intent: "Open on the narrator arriving at Crowe House after the coroner has
      left. Establish mood (damp evening, exacting eye), present the locked-room
      puzzle with precise evidence: a study locked from the inside, the antique
      clock stopped at 2:17, the torn letter in Edmund's hand, key missing from
      the lock, window latched, a single set of muddy bootprints outside. The
      narrator records sensory detail, meets Inspector Hart and Omar, and feels
      the puzzle's shape for the first time."
    present:
      - char-narrator
      - char-edmund-crowe
      - char-omar-klein
      - char-inspector-hart
      - loc-crowe-mansion-study
      - loc-crowe-mansion-foyer
      - obj-antique-clock
      - obj-brass-key
      - obj-torn-letter
      - obj-window-latch
      - obj-bootprints
    target_words: 700
  - id: s-002
    chapter: ch-01
    intent: Close, tense interviews and micro-examinations. The narrator interviews
      Lydia and Omar separately in the foyer and study; gathers their accounts
      and watches for breaks. Lydia's alibi has a hole; Omar's hands and shoes
      have traces that don't match his story. The narrator notices the ink blot
      and the familiar iron-gall bottle on the desk, and the torn letter's hand
      is nervous enough to suggest a last-minute confrontation. Dr. Ines Mali's
      observations tighten the time-of-death window. The narrator begins to
      sketch a hypothesis involving the clock and the ink bottle.
    present:
      - char-narrator
      - char-lydia-crowe
      - char-omar-klein
      - char-dr-ines-mali
      - loc-crowe-mansion-study
      - loc-crowe-mansion-foyer
      - obj-torn-letter
      - obj-ink-bottle
      - obj-antique-clock
      - obj-bootprints
      - obj-window-latch
    target_words: 700
  - id: s-003
    chapter: ch-01
    intent: "Experimentation and escalation: the narrator stays past dusk to
      re-create the locked-room conditions and examine the clock and desk. He
      manipulates the antique clock (wind, stop, examine false back), tests how
      a letter could be received and gripped with a poisoned blot, and traces a
      mechanism (string, pulley or clock-cam) that could have allowed the killer
      to leave and lock the door from outside. Suspicion shifts from an obvious
      suspect to a less obvious one as the narrator discovers a small but
      decisive physical trick involving the clock's false back and the key.
      Tension rises when a visitor (Daniel Kai) arrives at the gate, unexpected
      and distracted."
    present:
      - char-narrator
      - char-daniel-kai
      - char-omar-klein
      - loc-crowe-mansion-study
      - obj-antique-clock
      - obj-brass-key
      - obj-ink-bottle
      - obj-window-latch
      - obj-torn-letter
    target_words: 700
  - id: s-004
    chapter: ch-01
    intent: Denouement in which the narrator sets a trap to expose the murderer. He
      arranges the scene to force a reveal—either by staging the reappearance of
      the missing letter or by confronting the suspect with a reconstruction
      that proves access and motive. The reveal ties back to the clock's stopped
      time, the false back that hid the brass key, and a coerced confession or a
      flinch that only the guilty can make. Close on the narrator reflecting on
      the artifice of time, inheritance, and the way ordinary objects can be
      used to order death.
    present:
