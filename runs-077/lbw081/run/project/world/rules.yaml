note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "No supernatural explanations: every locked-room solution must be human
    (mechanical, psychological or misdirection) and physically plausible."
  - Forensic and timeline details must be internally consistent and match
    ordinary forensics (time of death windows, temperature effects on a stopped
    clock are not supernatural).
  - "The narrator is first-person and not omniscient: they do not know other
    characters' private thoughts unless observed or reported; claims on motive
    must be supported by evidence in the scenes."
  - All characters, locations and objects used later will be drawn only from the
    stable ids declared above; new entities must be added through the
    plan-update process.
  - No identifiable real persons or public figures are used or referenced.
