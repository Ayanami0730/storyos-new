note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - The ghost (char-isaac) is bound to the house (loc-elmhouse) and to objects
    that belonged to him (obj-wristwatch, obj-photograph, obj-porcelain-mirror).
    It cannot leave the property unless an object that carries its charge leaves
    with someone.
  - "Supernatural effects are tied to perceptual conduits: reflections
    (mirrors), memory-holding objects (photographs, watches), and locations that
    preserve repeated gestures (the attic, the loose floorboard). Phenomena will
    be repeatable and consistent: the same creak, the same stopped minute, the
    same mirrored motion each time they occur."
  - Documents and physical evidence found in the house are treated as accurate
    records of past events for the purposes of the story. A letter or ledger
    discovered in the attic is a canonical source; any claim derived from them
    must be recorded as such in the prose.
  - The ghost cannot invent facts or create new historical evidence; it can only
    re-embody past moments, gestures, fragments of speech and sensory
    impressions that tie to its grievance.
  - The narrator (char-alex) is a reliable witness of their perceptions.
    Hallucination as an explanation is permitted in the narrator's internal
    doubt, but the story's logic treats the phenomena as real in-world;
    contradictions must be explicitly resolved by scene evidence.
  - "Resolution must address the ghost’s revealed grievance (acknowledgement,
    naming of a responsible human, or removal of the binding object). There is
    no deus ex machina: any method of release or containment must operate within
    the rules above (e.g., moving the watch off-property moves the ghost's
    charge, naming the responsible party satisfies the need for truth)."
