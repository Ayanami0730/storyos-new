chapter: ch-01
scenes:
  - id: s-001
    intent: Establish the narrator, the house as a character, and the first
      destabilizing discoveries. Show the small, specific details that will
      later be clues (the stopped watch, the photograph under the loose
      floorboard, the rusty key from Hargreaves). End on an unsettling mirror
      detail so the supernatural insinuates itself quietly.
    present:
      - char-alex
      - char-hargreaves
      - loc-elmhouse
      - loc-living-room
      - loc-bedroom
      - obj-rusty-key
      - obj-wooden-floorboard
      - obj-photograph
      - obj-wristwatch
      - obj-porcelain-mirror
  - id: s-002
    intent: "Escalate: Alex experiences first unambiguous supernatural phenomena.
      The porcelain mirror and the loose floorboard produce contradictory,
      repeatable effects (a delayed reflection, the distinct creak that occurs
      without anyone on the boards). Introduce Mrs. Ellison as a human source of
      lore and a tentative warning. End with the ghost's voice growing specific
      — a name or a gesture — but not yet a full revelation."
    present:
      - char-alex
      - char-mrs-ellison
      - loc-bedroom
      - loc-living-room
      - obj-porcelain-mirror
      - obj-wooden-floorboard
      - obj-photograph
  - id: s-003
    intent: "Investigation and discovery. Alex forces the attic (using the rusty
      key), opens the locked drawer, finds the letter and ledger that supply
      historical facts: Isaac's daily schedule, a stopped entry around the time
      the watch stopped, and a hint of accusation (“keeper” / “door”). The attic
      is where the ghost manifests most completely — an apparition that repeats
      a fixed fragment of motion that matches a photograph. This scene supplies
      the logical core: the haunting is tied to documents and objects, not
      random malice."
    present:
      - char-alex
      - char-isaac
      - loc-attic
      - obj-rusty-key
      - obj-locked-drawer
      - obj-letter
      - obj-wristwatch
      - obj-photograph
  - id: s-004
    intent: "Confrontation and ambiguous payoff. Alex arranges the objects and reads
      the letter aloud while watching the porcelain mirror and the stopped
      watch. The ghost completes the missing scene in reflection: a past
      confrontation, an accusation, and the moment Isaac died. Alex must decide
      whether to name the responsible party (using what the documents imply) and
      thereby change the house's present. End with a visceral, frightening
      resolution: either a release so quiet it's uncanny, or a transfer — an
      object (the watch) leaving, or following Alex out — leaving the reader
      with a final, logical chill."
    present:
      - char-alex
      - char-isaac
      - char-hargreaves
      - loc-living-room
      - loc-attic
      - loc-bedroom
      - obj-porcelain-mirror
      - obj-letter
      - obj-wristwatch
      - obj-locked-drawer
      - obj-photograph
      - obj-rusty-key
