note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "No supernatural or anachronistic elements: all events must be realistic and
    historically plausible within a late-feudal/early-modern aristocratic
    household."
  - "Class and legal rules constrain marriage: a servant cannot lawfully marry
    the lord's daughter without the lord's explicit consent; betrothal sealed by
    the lord and priest is socially and legally binding within the story's
    community."
  - The lord's signet and a waxed seal constitute admissible proof of household
    orders and letters; misdelivery or tampering with sealed correspondence can
    be interpreted as evidence by household authorities.
  - Servants have limited access to private family spaces; evidence of
    impropriety (tokens in private quarters, misdelivered family letters) is
    treated as a serious offence and triggers formal inquiry.
  - Poisons and draughts exist as ordinary, non-magical substances with lethal
    potential; their use has realistic physical consequences and legal/moral
    implications in the story.
