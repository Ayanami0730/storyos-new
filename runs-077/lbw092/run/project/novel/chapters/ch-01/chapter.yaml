chapter: ch-01
scenes:
  - id: s-001
    intent: "Introduce characters and the first spark of connection: Elinor slips
      into the walled garden to escape the day's talk of alliances and meets
      Thomas, who returns her lost locket. Establish their differing worlds, the
      locket as token, Mara's cautious sympathy, and the manor's rigid
      separations."
    present:
