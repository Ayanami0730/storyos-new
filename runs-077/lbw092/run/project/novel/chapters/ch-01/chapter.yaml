      - loc-ashbury-manor
      - obj-thomas-handkerchief
  - id: s-002
    intent: "Deepen the secret bond and the stakes through clandestine meetings:
      Elinor and Thomas trade confidences in the kitchen and later on her
      tower-window seat; Mara acts as an unwitting facilitator. Their intimacy
      grows (a shared memory, a mended handkerchief, a small promise), while
      Lord Ashbury presses the case for Sir Edmund’s match — the signet and the
      house’s routines underscore the gulf between them."
    present:
