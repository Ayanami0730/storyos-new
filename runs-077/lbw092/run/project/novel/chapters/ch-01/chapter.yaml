  - id: s-004
    intent: "Tragic resolution: constrained by inheritance law, Lord Ashbury's sense
      of honour, and the household's order, Elinor makes a choice that seals the
      lovers' fate — a formal betrothal to Sir Edmund, a forced parting, and a
      private final meeting in which a desperate decision leads to irreversible
      loss. The scene must deliver elegiac consequence, focusing on the locket,
      the handkerchief and the manor's indifferent walls."
