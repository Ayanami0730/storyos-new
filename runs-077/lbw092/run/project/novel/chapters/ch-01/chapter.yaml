  - id: s-003
    intent: "Discovery, accusation, and the collision of private love with public
      duty: Gavin, the steward, finds suggestive evidence (a silk handkerchief,
      the locket tucked into a misdelivered waxed letter) and presents it to
      Lord Ashbury. The household's mechanisms — the chapel, the signet, the
      manor's rooms — press the lovers into exposure. Thomas is accused and
      brought before Father Bennet; Elinor confronts the impossibility of her
      position and the rising requirement for a public answer."
    present:
