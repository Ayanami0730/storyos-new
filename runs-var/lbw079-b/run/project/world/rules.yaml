note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - The ghost is anchored to objects of memory (the brass locket and the faded
    photograph). Those objects, while intact, allow the ghost to fix and replay
    a moment of its life via reflective surfaces.
  - "Reflections are the ghost's active domain: mirrors and other clear
    reflections can show the past as a layer over the present and can carry
    limited sensory impressions (voice, cold, a touch through the glass), but
    they do not automatically permit the ghost to 'step' into the physical
    world."
  - A ghost cannot leave the property unless it has a physical tether placed on
    it in the outside world (for example, the locket buried at the marsh).
    Returning a tether to the place tied to the tether can either sever the
    ghost's hold (freeing it) or strengthen the ghost's claim, depending on
    whether the act is done as a named remembrance or as an attempt to
    hide/forget it.
  - Physical destruction of the mirror severs the reflection-channel but does
    not by itself destroy the ghost; it redirects the ghost's attention to other
    reflections and, if done without the remembering ritual, can enrage the
    ghost and make it more dangerous.
  - "Naming matters: saying the ghost's name aloud while the tether and a
    reflection are present is a ritual act that changes the balance — it can
    either grant the ghost a 'witness' to be satisfied by (calming it) or allow
    it to take stronger hold of the namer if the namer's attention falters or
    they lie to themselves."
