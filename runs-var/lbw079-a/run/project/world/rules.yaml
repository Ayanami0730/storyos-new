note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - 1) Ghosts are anchored to unresolved actions, places, or singular objects;
    they cannot manifest independently of their anchor (the mirror and the doll)
    except as atmospheric effects.
  - "2) The mirror is a conduit for preserved perceptions (past 'frames') not a
    time machine: it can replay scenes exactly as they occurred (sensory
    fragments, emotions, and sound) but cannot alter physical records or create
    demonstrably new facts."
  - 3) Manifestations can influence living perception (cold, scent, auditory
    hallucination) and can move small, unsecured objects under specific,
    narratively-established conditions (e.g., when the lullaby plays), but they
    cannot levitate large heavy furniture or perform impossible physics.
  - "4) Technological recording devices (cameras, audio recorders) may register
    anomalies differently from human perception: sometimes capturing nothing a
    human sees, sometimes capturing sounds humans missed. This mismatch is
    consistent and explainable within each scene."
  - 5) A ghost's 'release' requires acknowledgement of the unresolved action
    (truth spoken or an act that symbolically completes the missing ritual).
    Physical destruction of an anchor (breaking the mirror) can sever an
    attachment but at a cost and with predictable local consequences — it will
    not erase the narrative consequences already written in diaries or records.
  - "6) No retroactive contradiction: nothing revealed later can contradict a
    committed textual or physical piece of evidence already established in the
    scenes (e.g., dates in the diary, public record facts). Any new revelation
    must be consistent with earlier, documented facts or explain how the earlier
    facts were misunderstandings."
