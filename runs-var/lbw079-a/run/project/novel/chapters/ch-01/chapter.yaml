chapter: ch-01
scenes:
  - id: s-001
    intent: Set tone and narrator's practical voice; show Lena arriving at Harper
      House, inventorying trunks, finding the covered antique mirror, the diary
      and the porcelain doll. Introduce the first inexplicable anomaly in the
      mirror — a delayed reflection and a child's small hand where none should
      be — framed as something Lena tries to explain rationally.
    present:
      - char-lena
      - loc-harper-house
      - obj-antique-mirror
      - obj-diary
      - obj-porcelain-doll
  - id: s-002
    intent: "Escalate the haunting logically: Lena reads the diary, winds the music
      box with the oval key, captures evidence (photograph, audio) and notes
      mismatches between instrument records and her perception. The mirror shows
      a replay of a child's last moments; small physical effects occur (cold,
      dust prints). Lena tests hypotheses — time, salt damage, suggestion — and
      pieces together dates and names."
    present:
      - char-lena
      - loc-harper-house
      - obj-diary
      - obj-music-box
      - obj-oval-key
      - obj-antique-mirror
      - obj-porcelain-doll
  - id: s-003
    intent: "Investigation deepens into the house's history: Lena follows archival
      clues and diary confessions to the cliff path, reading aloud to the mirror
      to provoke a response. The ghost becomes communicative, alternating
      accusation and plea; rules about what the mirror can and cannot show are
      tested and established. Lena learns Aunt May's culpability and realises
      freeing Mary requires a deliberate choice."
    present:
      - char-lena
      - char-aunt-may
      - char-mary-ghost
      - loc-cliff-path
      - loc-harper-house
      - obj-diary
      - obj-antique-mirror
      - obj-porcelain-doll
  - id: s-004
    intent: "Climax and ambiguous resolution: Lena confronts the ghost at the mirror
      with a ritual of naming and the doll as token; she chooses how to release
      the child (smash the mirror, read the confession aloud, or return the doll
      to the sea). The scene delivers a visceral supernatural escalation and
      then an ending that feels like release but leaves a final image that
      unsettles — a reflection that shouldn't be there or a small, inexplicable
      physical residue — ensuring lingering terror."
    present:
      - char-lena
      - char-mary-ghost
      - loc-harper-house
      - loc-cliff-path
      - obj-antique-mirror
      - obj-porcelain-doll
      - obj-diary
