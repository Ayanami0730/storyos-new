id: obj-porcelain-doll
sketch: A battered porcelain doll with sewn eyes and a stitched smile, stored in
  a cedar trunk. It belonged to Mary and appears in mirror reflections,
  sometimes moved and sometimes in place.
notes:
  - 'Source: s-001 (.writer/drafts/s-001.md;
    .context-builder/history/ch-01/s-001.md). "Inside, cedar shavings smelled
    faintly of the same old varnish the house kept; a battered porcelain doll
    lay cushioned on a folded scrap of dress, its eyes sewn and its smile
    stitched with someone too steady to be kind."'
first_seen: s-001
