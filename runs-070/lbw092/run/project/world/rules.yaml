note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - No supernatural elements or anachronistic technology — the story is grounded
    in a quasi-medieval household world.
  - "Household law: the lord has the social and legal authority within his
    household to arrange his heir's marriage and to punish servants for crimes
    (including conspiracy or aiding escape). Secret tokens or promises carry
    emotional meaning only; they confer no legal standing."
  - Marriage is a legal/sacral act that requires the lord's approval (or a
    priest with jurisdiction). A clandestine private promise between a noble and
    a servant does not create a recognized marriage in this world.
  - "Social mobility is limited: servants cannot inherit land or titles; they
    can be freed, bound, or punished, but any change to status must be
    explicitly recorded if it is to be a fact later in the manuscript."
  - "No deus ex machina: once a scene sets a fact (a letter intercepted, an
    order given), later scenes must carry its consequences — events are causal
    and traceable."
  - "Objects introduced (hairpin, sealed letter) are physical evidence: their
    existence, who possesses them, and any inscriptions or marks must be
    recorded in the index if later referenced."
