note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "Social hierarchy is rigid: nobles may contract marriages; servants have no
    legal claim to marriage with nobility and cannot inherit titles or land."
  - "The lord's authority within his household is near-absolute: he can order
    expulsion, binding betrothals, and disinheritance; his signet ring is the
    instrument of household legal acts."
  - The Church's rites (a priest's presence for a marriage or vow) are required
    for a marriage to be legally recognised. A private 'binding' without a
    priest has no standing.
  - "No supernatural or anachronistic elements: maintain physical realism and
    plausible period social mores."
  - Letters, tokens and objects are admissible as evidence in household disputes
    but may be ambiguous — provenance must be credible if later cited as fact.
  - Deaths and legal consequences follow realistic procedures (inquest,
    household inquiry) and will have social repercussions (loss of standing,
    rumour).
