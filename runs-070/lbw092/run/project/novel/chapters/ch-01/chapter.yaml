chapter: ch-01
scenes:
  - id: s-001
    intent: Introduce the household, social order and the first meeting that sets
      the tragedy in motion. Show Elys's confinement and Garr's small freedoms;
      have Elys drop or lend her ivory hairpin (obj-hairpin-ivory) to Garr as a
      private token. Establish Marta as a watcher/confidante and Lord Harrow's
      distant, controlling presence. End on the lovers' quiet promise — not
      legally binding, but intimate and absolute to them.
    present:
      - char-elys
      - char-garr
      - char-marta
      - char-lord-harrow
      - loc-walled-garden
      - obj-hairpin-ivory
      - loc-harrowhold
  - id: s-002
    intent: Deepen the relationship through secret meetings on the balcony and in
      the garden. Let them share stories that reveal their incompatibility with
      the world around them (her expected marriage, his limited future). Use
      Marta to assist or cover for them, and let the hairpin be both comfort and
      proof of affection. Introduce Aldric's name as the man Lord Harrow has in
      mind without yet staging the betrothal. End with Garr drafting (or
      promising to draft) a note proposing escape — the letter
      (obj-letter-sealed) is prepared but not yet delivered.
    present:
      - char-elys
      - char-garr
      - char-marta
      - char-lord-harrow
      - char-aldric
      - loc-balcony
      - loc-walled-garden
      - obj-hairpin-ivory
      - obj-letter-sealed
      - loc-harrowhold
  - id: s-003
    intent: "Raise the stakes: Lord Harrow announces Elys's betrothal to Aldric in
      the great hall. Publicly the household swells with congratulation and
      obligation; privately Elys and Garr plan a desperate elopement. The letter
      (obj-letter-sealed) is intercepted — either by Marta under coercion or by
      the guard — and shown to Lord Harrow. Captain Rowan is given an order to
      apprehend Garr. Show the moral conflict in Rowan and Marta's torment at
      betraying the lovers. End with Garr being taken from the stables/courtyard
      to face Lord Harrow's judgement."
    present:
      - char-lord-harrow
      - char-aldric
      - char-elys
      - char-garr
      - char-marta
      - char-rowan
      - loc-great-hall
      - loc-courtyard
      - obj-letter-sealed
      - loc-harrowhold
  - id: s-004
    intent: "Deliver the tragic payoff. In the courtyard, Garr is punished according
      to the household law Lord Harrow enforces; the punishment must be final
      and public (execution or banishment is the choice the prose will make).
      Elys, in a last desperate act, attempts to intervene or join him — using
      the hairpin (obj-hairpin-ivory) as a physical link to what was theirs —
      and the scene ends in irreversible loss. Explore the aftermath: Lord
      Harrow's hollow victory; Marta and Rowan's guilt; the burnt-out shape of
      Elys's choice. The scene must feel inevitable in retrospect: each earlier
      choice pushed it toward this end."
    present:
