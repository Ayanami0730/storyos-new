      - obj-locket-onyx
    target_words: 875
  - id: s-003
    chapter: ch-01
    intent: "Confrontation and ultimatum. Lord Garrick reads the letter (or is told
      its contents) and confronts Elisande in the manor hall and then in the
      private chapel. Explore Garrick's sense of honour and the pressure he
      exerts: an arranged marriage must be pursued, or Elisande must be
      disowned; Rowan must leave the household. Bring Rowan into the
      confrontation where he is dismissed and threatened; indicate the river as
      the only place they might try to escape to, with Hoswell dispatching men
      toward it."
    present:
      - char-lord-garrick
      - char-elisande
      - char-hoswell
      - char-priest-marder
      - char-rowan
      - loc-manor-hall
      - loc-chapel-stone
