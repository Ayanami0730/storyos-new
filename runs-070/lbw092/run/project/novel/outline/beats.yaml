scenes:
  - id: s-001
    chapter: ch-01
    intent: Introduce Elisande and Rowan and establish the class boundary and the
      secret that pulls them together. The scene must show how their meeting
      grows from small confidences to a private ceremony of exchange (the onyx
      locket), establish Ana as Elisande's confidante, and close with the
      discovery of a small sealed letter that someone else picks up — setting
      the inciting crisis.
    present:
      - char-elisande
      - char-rowan
      - char-ana
      - loc-rose-terrace
      - obj-locket-onyx
      - obj-letter-sealed
    target_words: 875
  - id: s-002
    chapter: ch-01
    intent: "Deepen the lovers' bond and give them agency: a planning of escape is
      hinted at but not fully formed. Show Rowan's inner life — his carved
      keepsakes and love of verse — in the servant quarters; show Ana's warning
      about risks. Introduce Hoswell the steward as a watchful presence who
      notices a detail (a misplaced glove, an unfamiliar step), and have Hoswell
      later present the sealed letter to Lord Garrick, raising the stakes."
    present:
      - char-rowan
      - char-elisande
      - char-ana
      - char-hoswell
      - char-lord-garrick
      - loc-servant-quarters
      - loc-rose-terrace
