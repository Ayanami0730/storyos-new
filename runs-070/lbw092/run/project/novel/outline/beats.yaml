    target_words: 875
  - id: s-004
    chapter: ch-01
    intent: "The tragic climax and aftermath. The lovers attempt to flee at the
      Willow by the River with the boat tied there; they are intercepted. The
      scene must stage a final choice — togetherness at any cost — and deliver
      the fatal consequence (death by the river, or a mutually chosen end). Then
      show the immediate aftermath in the manor: the bodies discovered,
      Garrick's ruinous remorse, and the locket returned to the chapel altar as
      an elegy. Close on the lasting moral cost."
