chapter: ch-03
scenes:
  - id: s-009
    intent: "Montage across decades: Rue ages, becomes an instructor and anchor. The
      narrative shows the Hundred as a cycle, friendships forming and
      dissolving, the three alumni used in different ways by the Academy
      (praise, warning, commodity). Time passes and the institution's scale
      becomes clear."
