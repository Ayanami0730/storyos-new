chapter: ch-02
scenes:
  - id: s-005
    intent: A meeting with the Headmistress in which the Academy's public
      rhetoric—rescue, education, charity—is made explicit. The Headmistress is
      persuasive about duty and result; her language glosses the Contract's
      margins. Rue senses double speech and leaves with more questions.
    present:
      - char-headmistress
      - char-rue
      - loc-great-hall
      - obj-contract
      - obj-amber-bell
  - id: s-006
    intent: "A year marker: the Academy's patron ceremony and the closing of the
      cohort ledger for that year. The number of new entrants is reiterated and
      the myth of the Three is placed alongside official praise. Rue begins to
      take on apprentices and becomes part of the institution's machinery."
    present:
      - collective-the-hundred
      - char-rue
      - char-loren
      - obj-folio
      - obj-amber-bell
  - id: s-007
    intent: "Tension builds: Rue discovers a discrepancy in the Folio and asks
      questions; senior staff are evasive. The idea that the Academy does not
      merely shelter but binds people becomes firmer. The Ten-Year period is
      framed as a crucible whose exits are historically vanishingly rare."
    present:
      - char-rue
      - loc-ink-room
      - obj-folio
      - obj-archive-key
      - char-headmistress
  - id: s-008
    intent: Rue finds a half-hidden clause in an old Contract that references a
      binding ritual and a tether. The Binding Seal's mechanics are hinted
      at—what it costs and how it ties people to the Academy's ledger. Rue's
      moral fog thickens; she remembers her younger self signing willingly.
    present:
      - char-rue
      - obj-contract
      - obj-binding-seal
      - loc-ink-room
      - char-loren
