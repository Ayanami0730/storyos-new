chapter: ch-04
scenes:
  - id: s-013
    intent: "Siege preparations: The Academy shifts from ritual to defense. The Bell
      rings differently; archives are sealed; the Folio's secrets — lists,
      contracts — become leverage. Rue and others must do work they never
      imagined: mending gates, tending wounded, preparing to hide or to
      negotiate."
    present:
      - char-rue
      - char-headmistress
      - group-the-hundred
      - obj-folio
      - obj-contract
      - loc-gates
      - obj-bell
  - id: s-014
    intent: "The gates are tested: The war reaches the walls. The Academy must
      decide whether to open, to bar, to bargain. The Headmistress offers terms
      the War Envoy will not accept; Rue is pushed into action — she is asked to
      read the Folio or to call on favors embedded in old contracts."
    present:
      - char-war-envoy
      - char-headmistress
      - char-rue
      - loc-gates
      - obj-folio
      - obj-contract
  - id: s-015
    intent: "Revelation and rupture: As siege and negotiation collide, the Archive's
      full ledger is exposed. The Academy's practices — how it binds girls, why
      most never leave — become known to the envoys and to those inside. Rue
      confronts what she signed and what the Academy has made of consent."
    present:
      - char-rue
      - loc-archive
      - char-war-envoy
      - char-headmistress
      - obj-folio
      - obj-contract
  - id: s-016
    intent: "Aftermath and choice: The war's immediate pressure forces a decision:
      maintain the old bargains, free some, or risk the Academy's dissolution.
      Rue must decide whether to use her knowledge and authority to press for
      release, to uphold the institution that sheltered her, or to burn the
      Folio."
    present:
      - char-rue
      - char-headmistress
      - char-war-envoy
      - group-the-hundred
      - group-the-three
      - obj-folio
      - obj-contract
      - loc-garden
      - loc-gates
