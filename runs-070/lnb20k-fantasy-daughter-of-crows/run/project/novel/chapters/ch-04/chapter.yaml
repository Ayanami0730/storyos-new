chapter: ch-04
scenes:
  - id: s-013
    intent: The Academy divides. Some staff and students insist on bargaining with
      the Envoy; others want to reinforce the gates or to free themselves. Rue
      is pulled between defending a place that preserved much of her life and
      acknowledging what it cost others. The Headmistress makes a choice that
      forces conflict.
    present:
      - char-rue
      - char-headmistress
      - char-loren
      - collective-the-hundred
      - char-war-envoy
      - obj-folio
  - id: s-014
    intent: The siege begins. The war's instruments strike the island's approaches;
      the Academy's defenses—both mundane and those tied to the Binding Seal and
      Folio—are activated. The cost of the Academy's bargains is made physical;
      the Hundred pay in fear, history and sacrifice.
    present:
      - loc-mercy-academy
      - loc-great-hall
      - collective-the-hundred
      - char-rue
      - char-war-envoy
      - obj-binding-seal
      - obj-amber-bell
      - obj-folio
  - id: s-015
    intent: "The Folio reveals what the Binding Seal actually took: a ledgering of
      lives and a mechanism that prevented departure for most. The Three's exit
      had costs: names exchanged, bargains fulfilled elsewhere. The Academy's
      myth of rescue is stripped to its ledgered reality; Rue must confront the
      life she chose to sell."
    present:
      - obj-folio
      - obj-binding-seal
      - char-rue
      - char-elaine
      - char-maris
      - char-sal
      - char-headmistress
  - id: s-016
    intent: "Rue's reckoning and the final choice: negotiate with the War Envoy, use
      the Binding Seal, or break the Folio's hold. Rue executes a plan born of
      experience and sacrifice that alters who may leave. The scene resolves the
      personal arc—Rue owning the consequence of her sale—and sets the Academy's
      new trajectory."
    present:
