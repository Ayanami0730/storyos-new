scenes:
  - id: s-001
    intent: "Open the novel on the transaction: Rue's decision to sell herself and
      sign the Contract. Establish the Mercy Academy's public face, the rule
      that it takes one hundred girls each year, and the notorious statistic
      that after ten years only three ever walk back out. Introduce the
      Contract, the Folio and the Headmistress as symbols."
