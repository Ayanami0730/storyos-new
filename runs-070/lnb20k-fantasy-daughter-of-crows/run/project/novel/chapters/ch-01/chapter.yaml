chapter: ch-01
scenes:
  - id: s-001
    intent: "Prologue: Rue, in poverty, makes the conscious choice to sell herself
      to the Mercy Academy. We see the private, practical reasons for her
      decision, the signing of the Contract, and the Ceremony Hall's polished
      charity. Establish Rue's voice and the moment of consent."
    present:
      - char-rue
      - loc-ceremony-hall
      - obj-contract
      - obj-folio
      - char-headmistress
      - group-the-hundred
      - loc-mercy-academy
  - id: s-002
    intent: "Arrival: The new Hundred are admitted. Rue moves into the Dormitory,
      meets a selection of the cohort, and learns the basic rules and rhythms —
      the Bell, the ledger, the chores. The Academy's public benevolence is
      shown alongside intimations of its strictness."
    present:
      - char-rue
      - group-the-hundred
      - loc-dormitory
      - obj-bell
      - loc-ceremony-hall
  - id: s-003
    intent: "First months: Rue adapts, makes friends and enemies among the Hundred,
      and is assigned duties that give her access to the Archive and the Folio.
      She begins to sense patterns — quiet disappearances, a silence around
      certain names."
    present:
      - char-rue
      - group-the-hundred
      - loc-archive
      - obj-folio
      - loc-garden
  - id: s-004
    intent: "The Ten-Year Stat: A lecturer or Headmistress's address makes explicit
      the Academy's ten-year expectation and the statistic that only three ever
      leave. Rue learns the institution's language — mercy, protection,
      permanence — and internalizes the scale of the bargain."
    present:
