scenes:
  - id: s-001
    chapter: ch-01
    intent: "Open the novel on the transaction: Rue's decision to sell herself and
      sign the Contract. Establish the Mercy Academy's public face, the rule
      that it takes one hundred girls each year, and the notorious statistic
      that after ten years only three ever walk back out. Introduce the
      Contract, the Folio and the Headmistress as symbols."
    present:
      - char-rue
      - loc-great-hall
      - loc-mercy-academy
      - obj-contract
      - obj-folio
      - obj-amber-bell
      - char-headmistress
      - collective-the-hundred
    target_words: 1176
  - id: s-002
    chapter: ch-01
    intent: "Show the Hundred's arrival: induction ritual in the Great Hall and
      first night. Rue meets Aya and senses the work the Academy does—education
      braided with discipline. The Folio is read; the Amber Bell is rung. The
      scene quietly suggests that the Academy gives girls skills but also takes
      something else."
    present:
      - collective-the-hundred
      - loc-great-hall
      - char-rue
      - char-aya
      - obj-folio
      - obj-amber-bell
      - char-loren
    target_words: 1176
  - id: s-003
    chapter: ch-01
    intent: "Depict the early years of training: classrooms, gardens, the Ink Room
      glimpsed. Introduce the Ink Room as a strange repository and the Binding
      Seal in passing. Rue learns craft and learns to measure the Academy's
      quiet demands. The Three are invoked as stories told to keep girls in
      line."
    present:
      - loc-ink-room
      - char-rue
      - char-loren
      - obj-binding-seal
      - collective-the-three
      - collective-the-hundred
    target_words: 1176
  - id: s-004
    chapter: ch-01
    intent: Close-up on Rue's interior life and her bond with Aya. Show why Rue sold
      herself—family debt, a promise—and what she hoped the Academy would be.
      Record small kindnesses and micro-violences, establishing the Academy's
      ambiguous benevolence.
    present:
      - char-rue
      - char-aya
      - collective-the-hundred
      - char-loren
    target_words: 1176
  - id: s-005
    chapter: ch-02
    intent: A meeting with the Headmistress in which the Academy's public
      rhetoric—rescue, education, charity—is made explicit. The Headmistress is
      persuasive about duty and result; her language glosses the Contract's
      margins. Rue senses double speech and leaves with more questions.
    present:
      - char-headmistress
      - char-rue
      - loc-great-hall
      - obj-contract
      - obj-amber-bell
    target_words: 1176
  - id: s-006
    chapter: ch-02
    intent: "A year marker: the Academy's patron ceremony and the closing of the
      cohort ledger for that year. The number of new entrants is reiterated and
      the myth of the Three is placed alongside official praise. Rue begins to
      take on apprentices and becomes part of the institution's machinery."
    present:
      - collective-the-hundred
      - char-rue
      - char-loren
      - obj-folio
      - obj-amber-bell
    target_words: 1176
  - id: s-007
    chapter: ch-02
    intent: "Tension builds: Rue discovers a discrepancy in the Folio and asks
      questions; senior staff are evasive. The idea that the Academy does not
      merely shelter but binds people becomes firmer. The Ten-Year period is
      framed as a crucible whose exits are historically vanishingly rare."
    present:
      - char-rue
      - loc-ink-room
      - obj-folio
      - obj-archive-key
      - char-headmistress
    target_words: 1176
  - id: s-008
    chapter: ch-02
    intent: Rue finds a half-hidden clause in an old Contract that references a
      binding ritual and a tether. The Binding Seal's mechanics are hinted
      at—what it costs and how it ties people to the Academy's ledger. Rue's
      moral fog thickens; she remembers her younger self signing willingly.
    present:
      - char-rue
      - obj-contract
      - obj-binding-seal
      - loc-ink-room
      - char-loren
    target_words: 1176
  - id: s-009
    chapter: ch-03
    intent: "Montage across decades: Rue ages, becomes an instructor and anchor. The
      narrative shows the Hundred as a cycle, friendships forming and
      dissolving, the three alumni used in different ways by the Academy
      (praise, warning, commodity). Time passes and the institution's scale
      becomes clear."
    present:
      - char-rue
      - collective-the-hundred
      - char-loren
      - char-aya
      - char-elaine
      - char-maris
      - char-sal
      - obj-folio
    target_words: 1176
  - id: s-010
    chapter: ch-03
    intent: "First sign of the external war: a War Envoy arrives at the harbor to
      speak with the Headmistress. The envoy's language is formal but unmoving;
      he carries news that the conflict is swelling toward the island. The
      Academy's insulated life is threatened for the first time in Rue's
      memory."
    present:
      - char-war-envoy
      - char-headmistress
      - loc-mercy-academy
      - loc-great-hall
      - char-rue
    target_words: 1176
  - id: s-011
    chapter: ch-03
    intent: "Envoy and Headmistress bartering: the Academy negotiates neutrality,
      offers shelter, and argues its civic usefulness. The envoy hints at
      demands—bonds, levies or recruits—that unsettle the Headmistress. Rue
      listens and realises the war will not be kept at bay by rhetoric."
    present:
      - char-war-envoy
      - char-headmistress
      - char-rue
      - loc-great-hall
      - collective-the-hundred
    target_words: 1176
  - id: s-012
    chapter: ch-03
    intent: "One of the Three returns to the Academy with a story that complicates
      the Headmistress's narrative: Elaine (or Maris or Sal) brings news from
      the outside that hints at what the Academy extracts for itself, and why so
      few leave. Their presence fractures the ritual certainties inside the
      walls."
    present:
      - char-elaine
      - char-maris
      - char-sal
      - char-headmistress
      - char-rue
      - loc-great-hall
      - collective-the-hundred
    target_words: 1176
  - id: s-013
    chapter: ch-04
    intent: The Academy divides. Some staff and students insist on bargaining with
      the Envoy; others want to reinforce the gates or to free themselves. Rue
      is pulled between defending a place that preserved much of her life and
      acknowledging what it cost others. The Headmistress makes a choice that
      forces conflict.
    present:
      - char-rue
      - char-headmistress
      - char-loren
      - collective-the-hundred
      - char-war-envoy
      - obj-folio
    target_words: 1176
  - id: s-014
    chapter: ch-04
    intent: The siege begins. The war's instruments strike the island's approaches;
      the Academy's defenses—both mundane and those tied to the Binding Seal and
      Folio—are activated. The cost of the Academy's bargains is made physical;
      the Hundred pay in fear, history and sacrifice.
    present:
      - loc-mercy-academy
      - loc-great-hall
      - collective-the-hundred
      - char-rue
      - char-war-envoy
      - obj-binding-seal
      - obj-amber-bell
      - obj-folio
    target_words: 1176
  - id: s-015
    chapter: ch-04
    intent: "The Folio reveals what the Binding Seal actually took: a ledgering of
      lives and a mechanism that prevented departure for most. The Three's exit
      had costs: names exchanged, bargains fulfilled elsewhere. The Academy's
      myth of rescue is stripped to its ledgered reality; Rue must confront the
      life she chose to sell."
    present:
      - obj-folio
      - obj-binding-seal
      - char-rue
      - char-elaine
      - char-maris
      - char-sal
      - char-headmistress
    target_words: 1176
  - id: s-016
    chapter: ch-04
    intent: "Rue's reckoning and the final choice: negotiate with the War Envoy, use
      the Binding Seal, or break the Folio's hold. Rue executes a plan born of
      experience and sacrifice that alters who may leave. The scene resolves the
      personal arc—Rue owning the consequence of her sale—and sets the Academy's
      new trajectory."
    present:
      - char-rue
      - char-war-envoy
      - char-headmistress
      - obj-binding-seal
      - obj-folio
      - collective-the-hundred
      - char-loren
    target_words: 1176
  - id: s-017
    chapter: ch-05
    intent: "Aftermath: show the new ledger of the Academy and its consequences for
      the survivors, Rue's last days and how the island changes. The ending is
      neither wholly punitive nor wholly redemptive; it asks what we owe
      ourselves and others when we sign contracts in desperation."
    present:
