scenes:
  - id: s-001
    chapter: ch-01
    intent: "Prologue: Rue, in poverty, makes the conscious choice to sell herself
      to the Mercy Academy. We see the private, practical reasons for her
      decision, the signing of the Contract, and the Ceremony Hall's polished
      charity. Establish Rue's voice and the moment of consent."
    present:
      - char-rue
      - loc-ceremony-hall
      - obj-contract
      - obj-folio
      - char-headmistress
      - group-the-hundred
      - loc-mercy-academy
    target_words: 1176
  - id: s-002
    chapter: ch-01
    intent: "Arrival: The new Hundred are admitted. Rue moves into the Dormitory,
      meets a selection of the cohort, and learns the basic rules and rhythms —
      the Bell, the ledger, the chores. The Academy's public benevolence is
      shown alongside intimations of its strictness."
    present:
      - char-rue
      - group-the-hundred
      - loc-dormitory
      - obj-bell
      - loc-ceremony-hall
    target_words: 1176
  - id: s-003
    chapter: ch-01
    intent: "First months: Rue adapts, makes friends and enemies among the Hundred,
      and is assigned duties that give her access to the Archive and the Folio.
      She begins to sense patterns — quiet disappearances, a silence around
      certain names."
    present:
      - char-rue
      - group-the-hundred
      - loc-archive
      - obj-folio
      - loc-garden
    target_words: 1176
  - id: s-004
    chapter: ch-01
    intent: "The Ten-Year Stat: A lecturer or Headmistress's address makes explicit
      the Academy's ten-year expectation and the statistic that only three ever
      leave. Rue learns the institution's language — mercy, protection,
      permanence — and internalizes the scale of the bargain."
    present:
      - char-headmistress
      - char-rue
      - loc-ceremony-hall
      - obj-folio
      - group-the-hundred
      - group-the-three
      - loc-mercy-academy
    target_words: 1176
  - id: s-005
    chapter: ch-02
    intent: "Rue's craft and investment: Over the middle years, Rue takes up a
      specialty (gardening/medicine/texts) that makes her valuable to the
      Academy. Scenes of care and small satisfactions complicate the moral
      picture: the Academy offers skill, shelter and meaning as well as
      restraint."
    present:
      - char-rue
      - loc-garden
      - loc-dormitory
      - loc-archive
    target_words: 1176
  - id: s-006
    chapter: ch-02
    intent: "The Folio's margins: Rue, working in the Archive, reads marginalia —
      cryptic notes about departures, names crossed out, and a small list that
      seems to track The Three. She sees that the Academy keeps more than public
      records; the Folio holds judgements."
    present:
      - char-rue
      - loc-archive
      - obj-folio
      - obj-contract
    target_words: 1176
  - id: s-007
    chapter: ch-02
    intent: "Headmistress's public face vs private choices: The Headmistress
      receives visitors and gives interviews. Rue observes the performance.
      Behind closed doors the Headmistress consults the ledger and argues with
      senior staff about who stays and who is permitted to leave."
    present:
      - char-headmistress
      - char-rue
      - loc-ceremony-hall
      - loc-archive
      - obj-folio
    target_words: 1176
  - id: s-008
    chapter: ch-02
    intent: "Life of the Hundred: A montage-like scene showing years passing in the
      Dormitory and Garden — births of friendships, small rebellions, ritual
      obedience. The Hundred are portrayed as a living social body with internal
      economies and loyalties."
    present:
      - group-the-hundred
      - loc-dormitory
      - loc-garden
      - obj-bell
    target_words: 1176
  - id: s-009
    chapter: ch-03
    intent: "The Myth of the Three: An older survivor of the Academy (one of The
      Three) returns in rumor or memory. Rue hears the story of an alumna who
      left and what she lost and gained; this scene complicates the idea of
      escape and presents a human face to the statistic."
    present:
      - char-rue
      - group-the-three
      - loc-garden
      - obj-folio
    target_words: 1176
  - id: s-010
    chapter: ch-03
    intent: "Middle turning: A policy change, a departure attempt, or a disciplinary
      event forces the Academy to reveal its enforcement machinery (sanctions,
      rooms, appeals). Rue's complicity — she benefits, has made peace with the
      rules — is shown; moral friction emerges."
    present:
      - char-rue
      - char-headmistress
      - group-the-hundred
      - loc-archive
      - loc-dormitory
    target_words: 1176
  - id: s-011
    chapter: ch-03
    intent: "The first hint of war: News arrives at the Gates of unrest beyond the
      city. The Headmistress and Academy administrators debate responses; Rue
      notices the first signs — travelers speaking of levies, the road's emptier
      wagons, and refugees refused beyond the wall."
    present:
      - char-headmistress
      - char-rue
      - loc-gates
      - loc-ceremony-hall
      - char-war-envoy
    target_words: 1176
  - id: s-012
    chapter: ch-03
    intent: "The Envoy at the Gates: The War Envoy arrives officially to deliver a
      warning or demand. Diplomacy plays against the Academy's self-image. Rue
      watches the negotiation from the Garden and recognizes that the war will
      force hard choices on the institution."
    present:
      - char-war-envoy
      - char-headmistress
      - char-rue
      - loc-gates
      - loc-ceremony-hall
      - loc-garden
    target_words: 1176
  - id: s-013
    chapter: ch-04
    intent: "Siege preparations: The Academy shifts from ritual to defense. The Bell
      rings differently; archives are sealed; the Folio's secrets — lists,
      contracts — become leverage. Rue and others must do work they never
      imagined: mending gates, tending wounded, preparing to hide or to
      negotiate."
    present:
      - char-rue
      - char-headmistress
      - group-the-hundred
      - obj-folio
      - obj-contract
      - loc-gates
      - obj-bell
    target_words: 1176
  - id: s-014
    chapter: ch-04
    intent: "The gates are tested: The war reaches the walls. The Academy must
      decide whether to open, to bar, to bargain. The Headmistress offers terms
      the War Envoy will not accept; Rue is pushed into action — she is asked to
      read the Folio or to call on favors embedded in old contracts."
    present:
      - char-war-envoy
      - char-headmistress
      - char-rue
      - loc-gates
      - obj-folio
      - obj-contract
    target_words: 1176
  - id: s-015
    chapter: ch-04
    intent: "Revelation and rupture: As siege and negotiation collide, the Archive's
      full ledger is exposed. The Academy's practices — how it binds girls, why
      most never leave — become known to the envoys and to those inside. Rue
      confronts what she signed and what the Academy has made of consent."
    present:
      - char-rue
      - loc-archive
      - char-war-envoy
      - char-headmistress
      - obj-folio
      - obj-contract
    target_words: 1176
  - id: s-016
    chapter: ch-04
    intent: "Aftermath and choice: The war's immediate pressure forces a decision:
      maintain the old bargains, free some, or risk the Academy's dissolution.
      Rue must decide whether to use her knowledge and authority to press for
      release, to uphold the institution that sheltered her, or to burn the
      Folio."
    present:
      - char-rue
      - char-headmistress
      - char-war-envoy
      - group-the-hundred
      - group-the-three
      - obj-folio
      - obj-contract
      - loc-garden
      - loc-gates
    target_words: 1176
  - id: s-017
    chapter: ch-05
    intent: "Epilogue: The novel's moral accounting. The Academy's future is set in
      a scene that shows the consequences of Rue's choice — whether a new cohort
      will be taken, whether the Folio's pages are rewritten, whether The Three
      become a larger number. Rue's voice closes the book, old and reconciled or
      not."
    present:
      - char-rue
      - loc-ceremony-hall
      - obj-bell
      - obj-folio
      - group-the-hundred
      - group-the-three
    target_words: 1176
