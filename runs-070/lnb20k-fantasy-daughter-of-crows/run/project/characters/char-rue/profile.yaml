id: char-rue
name: rue
sketch: Rue — A woman who sold herself into the Mercy Academy as a young woman.
  Quiet, practical, and watchful, she spends decades inside the Academy and
  grows into its reluctant conscience.
identity:
  appearance: young girl in the Great Hall, standing at the end of a bench holding
    a packet of papers
  origin: from a household that kept a small family ledger (debts and coughs recorded)
  profession: none (intake candidate)
  speech: quiet, inward; reads the folio like an account book
provenance:
  appearance: s-001
  origin: s-001
  profession: s-001
  speech: s-001
