note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - Every year, the Mercy Academy acquires exactly one hundred girls; that
    number is an institutional constant and must appear in the story's facts.
  - After a ten-year period within the Academy, only three individuals ever
    leave under normal circumstances; this must be stated and preserved as a
    factual statistic within the narrative.
  - Rue entered the Mercy Academy by selling herself; her consent and the
    Contract she signed must be an established fact in her backstory.
  - A war arrives and reaches the Academy's gates during Rue's later years; the
    war must affect events at the Academy and force reckonings with its past.
  - "The Folio and the Contract are authoritative objects inside the Academy:
    they record intake and the terms of binding. Any scene that refers to who is
    allowed to leave must trace to these artifacts or to a documented
    exception."
  - Do not contradict the above institutional facts anywhere in the story; if
    new facts about the Academy's practices are introduced, they must be
    consistent with the above constraints or be revealed as covert exceptions
    with provenance in the Archive.
