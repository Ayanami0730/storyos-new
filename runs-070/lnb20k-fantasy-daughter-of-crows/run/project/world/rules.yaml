note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - The Academy acquires exactly one hundred girls each year; this is enacted
    publicly at induction and recorded in the Contract Folio. This must be shown
    in early scenes and reiterated as ritual fact.
  - Entry into the Academy is contractual and recorded in the Contract Folio;
    signatures and ritual (the Amber Lantern and the Bronze Bell) are the formal
    mechanisms of transfer. The Folio's entries are binding within the society's
    recognized law and in the Academy's internal enforcement mechanisms.
  - After a ten-year period from an individual's entry, historical record shows
    only three individuals (the Three) ever left the Academy. The text must
    present this as a factual, auditable statistic in the world; any alternative
    explanations (escape, false death, cloakings) must be consistent with the
    archive's records and cannot contradict the three-exit fact without being
    explicitly recorded as a retcon in the Archive.
  - The Academy is not supernatural in the sense of all-powerful magic; it uses
    law, ritual, social control, and institutional networks to enforce its
    claims. Any mystical or uncanny elements must be limited and optional; the
    story hinges on institutional power and human choices.
  - The War is an external political-military force from the Kingdom. The War
    Envoy is its representative. The war can bring violence and political
    demands to the Academy's gates; it can break archives and expose secrets but
    cannot arbitrarily rewrite history—the Contract Folio's entries remain
    legible unless physically destroyed, and any such destruction must be shown
    in scene provenance.
  - "Characters' ages and timelines must be coherent: Rue enters as a young
    woman, ages across the book, and is convincingly old by the time the war
    arrives. The Academy's calendar and the ten-year mark must be narratively
    consistent."
  - Any departures, disappearances, or deaths inside the Academy must be
    recorded in the Archive unless the tale explicitly shows an attempt to erase
    or alter those records. Marginal notes, contradictions, and redactions in
    the Folio are permissible but must be presented with provenance (whose hand,
    what scene caused it).
