note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "Imagination is powerful but not supernatural: when the children call
    objects by quest-names (e.g., 'King's Sigil') or imagine transformations,
    only their perception and behavior change; physical laws (gravity, water
    current, friction) remain real and must be respected in the plot."
  - All action takes place within a single afternoon; no characters or events
    occur off-stage unless previously established in the plan (no surprise
    visitors or miraculous helpers).
  - Objects keep consistent physical properties across scenes (the
    obj-king-collar is small brass and can be lost in reeds; the
    obj-wooden-staff is a broom handle, sturdy but not magical).
  - Characters cannot be in two locations at once and must behave in ways
    consistent with their sketches (Hollis is imaginative and loud; Arden is
    quieter and cautious).
  - The story may echo Arthurian motifs (oaths, naming, coronation), but there
    is no real magic or prophecy—these are narrative devices the children use to
    give meaning to ordinary acts.
