note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "Imagination transforms the children's perception but does not alter
    physical reality: no magical changes happen to objects or people."
  - Objects cannot be created or teleported; anything used in a later scene must
    be introduced here in the plan as an entity.
  - Characters' ages, relationships, and personalities remain consistent across
    scenes.
  - Consequences of physical actions are realistic (traffic is dangerous,
    bridges under repair are impassable without detours).
  - "Dialogue and events should respect the tone established here: gently
    adventurous, grounded, and suitable for a middle-school audience."
