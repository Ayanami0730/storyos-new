scenes:
  - id: s-001
    chapter: ch-01
    intent: "Set up the daily task and the central relationship: Eloise collects the
      lunchbox and brooch at loc-eloise-house, explains the 'quest' to Jun, and
      we see the map and the rules of their imaginative game. Establish stakes
      (the brooch must reach Mrs. Halloway at loc-halloway-house), voice, and
      the tone that will let ordinary obstacles be read as mythic challenges."
    present:
      - char-eloise
      - char-jun
      - char-mrs-halloway
      - obj-lunchbox
      - obj-brooch
      - obj-map
      - loc-eloise-house
      - loc-main-street
      - loc-halloway-house
    target_words: 500
  - id: s-002
    chapter: ch-01
    intent: "Turn a mundane crossing and a run-in with Milo into the first trials:
      leaving loc-eloise-house they confront loc-main-street and the blocked
      loc-old-bridge which become a moat and a broken causeway; Eloise's
      imagination reframes traffic, construction, and Milo's taunts as threats.
      Jun's practical bravery helps them navigate the real danger while the
      fantasy keeps them steady."
    present:
      - char-eloise
      - char-jun
      - char-milo
      - loc-main-street
      - loc-old-bridge
      - loc-eloise-house
      - obj-flashlight
      - obj-lunchbox
    target_words: 500
  - id: s-003
    chapter: ch-01
    intent: "Complication: the obj-brooch slips from the lunchbox during a struggle
      and is lost in loc-park. The search there becomes an Arthurian 'dark wood'
      sequence: tense, sensory, and imaginative. Jun's resourcefulness and
      Eloise's refusal to give up deepen their bond. They find the brooch by
      combining imagination (the map) and a practical observation; note that the
      lunchbox and map are still present."
    present:
      - char-eloise
      - char-jun
      - loc-park
      - loc-eloise-house
      - obj-brooch
      - obj-map
      - obj-flashlight
      - obj-lunchbox
    target_words: 500
  - id: s-004
    chapter: ch-01
    intent: "Resolution and payoff at loc-halloway-house: Mrs. Halloway receives the
      brooch, tells a quiet story that reframes the journey's meaning
      (forgiveness, memory, bravery), and rewards the children with gratitude
      and a simple keepsake. Milo reappears with a small conciliatory gesture.
      Close with the theme: ordinary chores can be brave quests when shared with
      friends."
    present:
      - char-eloise
      - char-jun
      - char-mrs-halloway
      - char-milo
      - loc-halloway-house
      - obj-lunchbox
      - obj-brooch
    target_words: 500
