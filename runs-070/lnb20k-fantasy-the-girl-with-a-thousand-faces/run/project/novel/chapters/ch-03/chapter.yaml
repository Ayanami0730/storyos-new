  - id: s-011
    intent: "Mercy follows a physical trail to an abandoned storeroom where she
      finds personal remnants: names scratched on a wall, an image burned into
      plaster, and finally the bloodstained locket’s counterpart. The evidence
      ties specific residents to the wartime incident and escalates moral
      stakes."
