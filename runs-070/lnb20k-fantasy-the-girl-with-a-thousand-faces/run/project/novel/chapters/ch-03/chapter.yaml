chapter: ch-03
scenes:
  - id: s-009
    intent: "Lin Wei’s nightmares intensify; Mercy watches over the child and in a
      liminal night-ritual extracts a memory-vision that reveals a wartime scene
      tied to the locket: soldiers, a burned courtyard, a betrayal. The spirit’s
      origin becomes clearer but contains morally ambiguous actors from within
      the City."
