  - id: s-010
    intent: Tensions in the community reach a breaking point as accusations flare.
      Mercy negotiates between factions—those who want to repel the spirit by
      force, those who prefer silence. She struggles to persuade them that the
      exorcism must be a communal acknowledgment rather than simple banishment.
