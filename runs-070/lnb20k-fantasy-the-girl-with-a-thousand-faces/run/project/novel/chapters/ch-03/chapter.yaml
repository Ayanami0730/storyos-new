    intent: The vengeful spirit grows bolder, possessing objects and projecting
      painful memories into public spaces; Mercy attempts a high-risk binding
      that partially contains the spirit but leaves it embedded in the City’s
      memory—revealing that it cannot be removed without truth and
      acknowledgment.
