  - id: s-014
    intent: The community must choose a difficult sacrificial act—ritualized
      confession, reparative offering, or the destruction of physical
      evidence—that will let the spirit heal or else doom the City to continued
      haunting; Mercy grapples with whether to demand personal risk from
      residents she serves.
