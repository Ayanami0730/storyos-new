chapter: ch-04
scenes:
  - id: s-013
    intent: Mercy traverses the Walled City maze as the spirit conjures wartime
      reenactments—the city becomes a theater of its own past. The Young Refugee
      confronts the memory that has haunted him and gains agency.
    present:
      - char-mercy-chan
      - spirit-vengeful
      - char-young-refugee
      - loc-kowloon-walled-city
      - obj-family-photo
  - id: s-014
    intent: "A revealed testimony and the Elder’s scroll show the true origin: a
      massacre where neighbors chose survival over rescue, and a wound sewn shut
      by silence. Mercy negotiates with the spirit, offering a different
      ritual—naming and bearing witness."
    present:
      - spirit-vengeful
      - char-mercy-chan
      - char-elder-storyteller
      - loc-bombed-yard
      - obj-story-scroll
      - obj-ritual-kit
  - id: s-015
    intent: "Climax: the final, costly exorcism in the Walled City’s central
      courtyard. Ritual rules are tested; Mercy sacrifices a part of her power
      or memory to free the community. The spirit either is released or
      transformed."
    present:
      - char-mercy-chan
      - spirit-vengeful
      - faction-residents-commune
      - obj-ritual-kit
      - loc-central-courtyard
      - char-young-refugee
  - id: s-016
    intent: "Aftermath and reckoning: the residents begin tentative acts of
      remembrance and repair; Mercy counts the cost in herself and the city. An
      epilogue gesture shows that memory work continues, and Mercy’s practice
      has changed."
    present:
      - faction-residents-commune
      - char-mercy-chan
      - char-young-refugee
      - char-elder-storyteller
