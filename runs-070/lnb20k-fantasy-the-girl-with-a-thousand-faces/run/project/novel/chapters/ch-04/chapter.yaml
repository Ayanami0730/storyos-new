chapter: ch-04
scenes:
  - id: s-013
    intent: "Elder Lau organizes a testimony circle; residents begin telling
      fragmented truths. Mercy acts as ritual mediator. As memories surface, the
      spirit manifests fully and speaks: it is both victim and agent, its hatred
      tied to a wounded promise the City made and broke in wartime."
