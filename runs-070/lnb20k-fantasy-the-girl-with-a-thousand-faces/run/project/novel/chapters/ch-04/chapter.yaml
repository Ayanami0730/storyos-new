  - id: s-015
    intent: "Climax: Mercy performs the older ritual with Elder Lau and the
      community present, using the mirror and the knife. The spirit resists,
      unleashing visions of wartime violence; Mercy is tested to her limit and
      must decide whether to bind, release, or merge the spirit's memory into
      communal narrative."
