  - id: s-007
    intent: "A public exorcism at the communal shrine: Mercy calls for a rite that
      requires community participation. The ritual initially seems to succeed
      but instead enrages the spirit, which lashes out through memory-laced
      illusions, causing neighbors to accuse one another and fray trust."
