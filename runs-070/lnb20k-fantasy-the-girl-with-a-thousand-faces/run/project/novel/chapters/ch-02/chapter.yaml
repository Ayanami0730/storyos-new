  - id: s-006
    intent: Mercy researches the locket and the wartime rumor, visiting the Bazaar
      for gossip and foraging a physical lead—someone who used to live near the
      alleged massacre. The Walled City’s maze resists certainties; Mercy senses
      that the ghost’s power is woven into shared silence.
