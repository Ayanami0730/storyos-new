  - id: s-005
    intent: At the makeshift hospital Mercy meets a wounded neighbor and hears more
      fractured testimony; Elder Lau reluctantly reveals a specific wartime
      episode—an atrocity or betrayal—that could be the spirit’s origin, but
      gives only a partial account and demands caution.
