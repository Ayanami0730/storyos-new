    intent: Neighbors press Mercy for help; introduce the communal dynamics and
      fear. Mercy meets Elder Lau and hears a fragmentary oral memory about a
      wartime incident that many prefer not to speak of; the scene plants the
      linkage between the haunting and suppressed history.
