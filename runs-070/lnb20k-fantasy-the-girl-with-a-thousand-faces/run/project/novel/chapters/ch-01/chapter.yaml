  - id: s-002
    intent: Mercy visits the Spiral Alley where the sightings began; she assesses
      physical signs, performs a short reading with her knife, and encounters
      her first direct hint of a malicious intelligence—an unnatural cold and a
      whisper that repeats an unfinished plea.
