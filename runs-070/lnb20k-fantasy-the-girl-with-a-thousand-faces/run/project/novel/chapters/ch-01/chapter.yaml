    intent: Lin Wei, the young refugee, is introduced—confused, bereft; Mercy sees
      in Lin Wei a personal trace that matches the spirit’s whisper. A minor,
      failed exorcism attempt later that night escalates the haunting, injuring
      a neighbor and proving the spirit’s unusual potency.
