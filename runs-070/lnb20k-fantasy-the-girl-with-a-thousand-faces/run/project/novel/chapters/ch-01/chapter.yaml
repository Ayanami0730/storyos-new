chapter: ch-01
scenes:
  - id: s-001
    intent: Open on the Walled City’s claustrophobic life under wartime strain;
      introduce Mercy Chan at work in her cramped room as she finishes a small
      ritual and receives the first frantic summons from neighbors about strange
      noises and a child who saw a black shape.
