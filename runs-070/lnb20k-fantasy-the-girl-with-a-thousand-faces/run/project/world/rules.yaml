note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "Spirits are empowered by unresolved traumatic memory: the more communal
    silence around an event, the stronger the spirit tied to it becomes."
  - Rituals require both correct material forms (tools, words, offerings) and
    participation or consent from the community to fully alter a spirit’s
    status.
  - "Mercy’s ritual power is effective but limited and costly: each major rite
    draws on her physical and spiritual reserves and can leave lasting wounds."
  - "No anachronisms: the story must adhere to World War II–era Hong Kong
    technology, social structures, and language sensibilities; all historical
    facts used must be later traced to cited scenes for provenance."
  - "Supernatural effects must interact with social and emotional reality:
    exorcism succeeds or fails in ways that produce concrete consequences
    (injury, confessions, social rupture) within the City."
  - The novel will prioritize the Walled City’s lived geography (alleyways,
    rooftops, communal shrines) as a character—no deus ex machina transports out
    of the City during rites.
  - The vengeful spirit cannot be destroyed by force alone; its resolution
    requires addressing the historical wound that sustains it (acknowledgment,
    testimony, or reparative act).
