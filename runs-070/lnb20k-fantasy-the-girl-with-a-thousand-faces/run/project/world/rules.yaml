note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - The story is set during World War II–era Hong Kong (Japanese occupation
    era); technology, institutions, and social constraints must be
    period-appropriate and not anachronistic.
  - "Supernatural mechanics: spirits exist and interact with humans, but their
    strength is tied to human memory, trauma, and communal denial rather than
    undifferentiated magical fiat."
  - "Rituals have material and social costs: a successful rite requires
    ingredients, consent or participation from the living, and can have tangible
    side-effects (psychological, physical, or social) on individuals and the
    community."
  - "No deus ex machina: Mercy cannot simply 'erase' the spirit with a single
    magical trick; resolution requires investigation, negotiation, and communal
    confrontation of historical events."
  - "The revenant’s power is amplified by wartime violence: historical
    atrocities, suppressed confessions, and collective silences feed it; the
    spirit is not merely evil but a wound given form by historical neglect."
  - "The Walled City’s geography matters: tight spaces, layered dwellings,
    roofs, and shared courtyards affect how rituals operate and how the
    community responds."
  - "Ethical constraint: exorcisms may harm the living—physically, economically,
    or socially—and these harms must be acknowledged and shown in consequences."
  - "Characters’ memories and oral histories are treated as evidence:
    discoverable, mutable under the spirit’s influence, and central to resolving
    the conflict."
