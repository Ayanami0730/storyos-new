id: obj-bloodstained-cloth
sketch: Bloodstained Cloth — a ragged piece of fabric found with the refugee,
  stained in a way that suggests wartime injury; a potent emotional anchor for
  the spirit.
notes:
  - Found by a young refugee in s-004; corner darkened and browned; metallic
    tang of dried blood and damp earth; causes amplification of the wailing when
    exposed to breeze.
first_seen: s-004
