id: loc-temple-shrine
sketch: Temple/Shrine — cramped neighborhood shrine used for household offerings
  and small rites; Mercy and the Elder use it as a staging ground.
notes:
  - 'introduced in s-003: "The shrine room smelled of old incense and boiled
    rice, a sweet sour that sat under the air like a patient thing." Shrine
    contains low altar, dented censer, talismans, folded incantation slip,
    chalk, little knife; rites produce coldness, layered voices, and sensory
    injury to Mercy.'
first_seen: s-003
