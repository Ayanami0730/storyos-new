id: loc-alley-13
sketch: Alley 13 — a narrow service alley with stacked laundry, small shops, and
  a notorious bend where shadows gather; a frequent site of minor hauntings.
notes:
  - scene s-001 places wailing at Alley 13; tiles under Mercy's boots thrummed
    with it; pan clattered though no one was near it.
  - Used in many scenes as the locus of spirit activity and mapping exercises;
    s-010 describes mapping with chalk, pebble and talisman placing, and
    witnesses.
first_seen: s-001
