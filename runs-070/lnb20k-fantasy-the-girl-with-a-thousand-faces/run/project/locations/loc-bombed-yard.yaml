id: loc-bombed-yard
sketch: Bombed Yard — a small courtyard scarred by wartime shelling and
  makeshift burials; the physical wound in the city that anchors much memory.
notes:
  - "Introduced in s-004: pocked ground with shallow pits, makeshift burial
    markers (splintered board, tin can, turned shoe), scraping wind; presence
    responds to objects like a cloth."
first_seen: s-004
