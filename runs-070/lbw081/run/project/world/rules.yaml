note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "No supernatural explanations: every effect must have a physical,
    human-scale cause."
  - All mechanical trickery and forensics must be physically plausible with
    late-19th/early-20th-century to contemporary hand tools and clockwork; no
    exotic or high-tech gadgets.
  - Locked-room means the study's door is locked from the inside and windows are
    latched; there are no unknown or unexplored secret passages unless
    explicitly named as an entity in the plan.
  - Detective's methods are limited to human observation, conversation,
    reconstruction, and standard local forensic input (char-dr-simms); no
    omniscient leaps or unavailable lab results.
  - Every clue introduced in a scene must have a discoverable physical source
    (an object, a mark, a document, or a witness) present in the plan's entity
    list.
