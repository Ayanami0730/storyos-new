chapter: ch-01
scenes:
  - id: s-001
    intent: "Open the case: establish narrator, setting and stakes; present the
      locked-room puzzle and immediate physical constraints (locked door,
      latched windows, no weapon). Show the assembled cast and their motives;
      plant the first physical clues — stopped pocket watch, worn spot on
      obj-chair-study, and the mantel clock's chime as a timing device."
    present:
      - char-james-cole
      - char-victor-hale
      - char-lucy-hale
      - char-alfred-broome
      - char-owen-myers
      - char-evelyn-ross
      - loc-hale-mansion
      - loc-study
      - loc-foyer
      - obj-chair-study
      - obj-mantel-clock
      - obj-pocket-watch
      - obj-will-draft
  - id: s-002
    intent: "Investigation and interrogations: the narrator inspects the study
      closely, noting mechanical traces (a faint grease smear, a missing screw,
      a tiny abrasion on the chair frame). Interview the household; elicit
      competing alibis and motives. Introduce a misleading lead (the
      clock-repairman, char-owen-myers, seems the obvious culprit because of his
      skills) and the apparent airtight alibi (obj-rail-ticket)."
    present:
      - char-james-cole
      - char-lucy-hale
      - char-alfred-broome
      - char-owen-myers
      - char-evelyn-ross
      - loc-study
      - loc-kitchen
      - obj-chair-study
      - obj-mantel-clock
      - obj-rail-ticket
      - obj-file-rasp
  - id: s-003
    intent: "Forensic reconstruction: the narrator reconstructs how a spring-loaded
      spike (obj-spring-spike-device) could be timed to the mantel clock chime
      and leave no weapon behind. He tests the hypothesis in the study
      (carefully) and uncovers the device's components hidden in the chair — and
      the crucial physical link that narrows suspects to someone with steady
      access and mechanical skill. Suspense rises as the narrator faces the
      possibility that the killer is someone who was supposed to be 'invisible'
      — the butler."
    present:
      - char-james-cole
      - char-alfred-broome
      - char-owen-myers
      - char-dr-simms
      - loc-study
      - obj-chair-study
      - obj-mantel-clock
      - obj-spring-spike-device
      - obj-file-rasp
  - id: s-004
    intent: "Confrontation and reveal: the detective lays out the chain of
      mechanical evidence, exposes how the murderer used Victor's trust and the
      house routines to install and trigger the device, and forces a confession
      or a tell that only the guilty party could have made. Close with the
      detective reflecting on the smallest trace that solved the locked-room and
      what it cost them — moral and emotional closure rather than forensic
      trivia."
    present:
