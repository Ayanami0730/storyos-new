note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "No anachronistic technology or cultural references: 1956 period-appropriate
    items only (no mobile phones, internet, social media, or modern slang)."
  - Do not invent major historical events or alter recorded history in
    consequential ways; the encounter is personal and private and must not
    trigger real-world geopolitical changes.
  - Royal protocol and chain-of-command in 1950s Britain may be dramatized but
    should remain plausible; staff speak and act within plausible constraints of
    loyalty and discretion.
  - "Public reactions are constrained by 1950s press practices: newsreels, print
    newspapers, wire services and gossip columns, not instant global
    dissemination."
  - Characters' ages and relationships to real historical figures must be
    plausible for 1956 and must not attribute historically impossible actions to
    real public figures beyond the contained fictional encounter.
