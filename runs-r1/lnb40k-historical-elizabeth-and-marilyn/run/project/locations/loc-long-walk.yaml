id: loc-long-walk
sketch: "The Long Walk and Great Park: avenues and summer light, public vistas
  that still permit private movement at their edges."
notes:
  - Used by the Queen for a private walk in s-001.
  - "time_of_day: late_afternoon — \"The sun leaned lower; shadows grew longer
    and the castle's parapets, lit at the edges, looked for a moment like a
    drawing pressed into the paper of the sky.\""
first_seen: s-001
