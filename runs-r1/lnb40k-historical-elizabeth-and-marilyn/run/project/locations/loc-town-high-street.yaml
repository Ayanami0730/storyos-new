id: loc-town-high-street
sketch: "Windsor's high street: tea rooms, a cinema, small shops and an
  atmosphere of summer tourism and local gossip."
notes:
  - '"Outside, the town looked like a film one frame at a time: the postman on
    his route, the newsboy arranging papers, the cinema’s poster rolled like a
    promise." — scene s-003'
