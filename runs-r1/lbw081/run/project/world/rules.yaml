note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - No supernatural explanations; every effect has a physical or human cause.
  - Physical actions (mechanical triggers, pulleys, climbs) must obey normal
    physics and the constraints of a late-20th/early-21st-century English manor
    house.
  - Forensic facts (stoppage of clock, blood spatter, fingerprints, cigar ash,
    monogram identification) are admissible and treated realistically — i.e.,
    they can be partial and ambiguous but cannot be ignored without reason.
  - The narrator (Crowe) is fallible and does not have knowledge beyond what can
    be reasonably observed, deduced, or learned by questioning witnesses and
    examining physical evidence.
