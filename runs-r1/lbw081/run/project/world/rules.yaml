note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - No supernatural elements or 'impossible' physics — every action must be
    explainable by real mechanisms or human trickery.
  - The narrator, Ellis, cannot know anything he didn't observe, be told, or
    reasonably infer; revelations must come by evidence or deduction shown
    in-scene.
  - Forensic details (gunshot residue, fingerprints, time of death signs) must
    be internally consistent and not contradicted later.
  - All significant objects, locations and characters used in scenes must be
    declared as entities above; later scenes may only refer to these ids.
  - "Locked-room constraints are physical: doors and windows can only be
    manipulated by plausible mechanical means or realistic sleight, and any
    trick must be demonstrable within the story's scenes."
  - No retroactive retcons of committed facts; if a gap exists it must be
    acknowledged as such in the prose and can be left unresolved.
