chapter: ch-01
scenes:
  - id: s-001
    intent: "Open on the locked-room discovery: Ellis arrives at Harben House, meets
      Inspector Lane and Anna, and is shown the study that is locked from the
      inside with Lucius Harben dead. Establish stakes, the room's layout
      (longcase clock, display case, desk), the brass key in the lock, the torn
      note in the victim's hand and the initial puzzle—no gun on display."
    present:
      - char-ellis-fletcher
      - char-inspector-margot-lane
      - char-anna-rowe
      - char-lucius-harben
      - loc-harben-study
      - loc-harben-foyer
      - obj-longcase-clock
      - obj-brass-key
      - obj-torn-note
      - obj-ivory-revolver
  - id: s-002
    intent: "Ellis inspects the study in detail: examines the clock (stopped at a
      specific minute), checks the weapon display (revolver missing or hidden),
      finds black thread behind the clock and the envelope on the desk. He
      interviews Iris Harben and Thomas Reed separately—collect their alibis,
      motives (financial quarrel, threatened sale), and small tells. Inspector
      Lane warns Ellis about upsetting the investigation but tacitly lets him
      proceed."
    present:
      - char-ellis-fletcher
      - char-iris-harben
      - char-thomas-reed
      - char-inspector-margot-lane
      - char-anna-rowe
      - loc-harben-study
      - loc-harben-foyer
      - obj-longcase-clock
      - obj-ivory-revolver
      - obj-black-thread
      - obj-envelope
  - id: s-003
    intent: "Ellis pursues a mechanical hypothesis: the clock's internal train could
      have been used as a timed trigger. He finds evidence of recent access to
      the clock's inner case and that the torn note was put in the victim's hand
      after death. Tensions rise when Ellis confronts Thomas, who admits to
      servicing the clock recently but denies any role in the death. An
      unexpected piece of evidence (a fingerprint or a peculiar crease in the
      envelope flap) points to Iris in a way that seems damning and believable."
    present:
      - char-ellis-fletcher
      - char-thomas-reed
      - char-iris-harben
      - char-inspector-margot-lane
      - loc-harben-study
      - obj-longcase-clock
      - obj-black-thread
      - obj-torn-note
      - obj-envelope
  - id: s-004
    intent: "Final scene: Ellis lays out the mechanics of the staged 'locked room'
      and exposes the murderer. He demonstrates how the clock and the black
      thread, together with a hidden placement of the ivory revolver inside the
      clock case, allowed someone to fire the weapon and then make the room look
      sealed. The twist: the person with motive and opportunity is not the
      obvious suspect; Iris engineered it to look like Thomas's specialized
      knowledge did the deed. The resolution ties the torn note and envelope
      into the motive, and leaves a hint that Ellis will not be content until he
      knows what became of a small piece of the collection."
    present:
