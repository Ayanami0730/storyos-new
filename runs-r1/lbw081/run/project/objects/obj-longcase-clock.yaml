id: obj-longcase-clock
sketch: An ornate longcase (grandfather) clock, a prized item in Lucius's
  collection. It has visible hands, a striking mechanism, and an access panel in
  its case.
notes:
  - .writer/drafts/s-001.md L20-L40
  - "Observed in s-002: hands frozen at eleven seventeen; pendulum motionless;
    rear access panel a hair ajar with latch crooked. Provenance:
    .writer/drafts/s-002.md L5-L8"
  - '"The longcase clock took the far wall and held the light. The access panel
    at the back was a hair ajar; the brass inside looked thumbed, varnish rubbed
    away where skin or a tool had rested. Fine, fresh scores ringed the
    latch—hairline marks that flashed when the light caught them, as if a
    slender implement had been used to lever it." (manuscript s-003, L3-L5)'
  - >-
    "Forensics pried free a false rear shelf and photographed it; a technician
    eased a gloved finger into the gap and, after a careful shot, showed me the
    pictures. The images, and what the tech described, made the rest plain: a
    shallow cavity sat behind the shelf, the exact dimensions a small revolver's
    grip would have occupied." (manuscript .writer/drafts/s-004.md L3-L3)


    "Putting those pieces together suggested the mechanism. The clock's strike
    train would deliver a reliable tug at a set minute; the thread, fixed to the
    bracket, would pull the trigger. ... a small notch or catch beneath the
    barrel could then take a rim as the case settled, leaving the access panel
    to sit crooked as if latched from inside." (manuscript
    .writer/drafts/s-004.md L7-L7)


    Notes: photographic evidence of a false shelf and shallow cavity; hypothesis
    recorded exactly as described in scene s-004.
first_seen: s-001
