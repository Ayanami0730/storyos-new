id: obj-torn-note
sketch: A scrap of paper found clutched in Lucius's hand with part of a sentence
  visible. Its provenance and whether it is genuine or planted is in question.
notes:
  - .writer/drafts/s-001.md L80-L100
  - "\"The ragged edge lay on top of the knuckles; the torn fibres splayed
    against the skin rather than pressed into it. The blotter beneath showed a
    neat, round stain—the dark halo of a single shot. The scrap sat on that halo
    without a smear. If he'd clutched the paper in his last moments the fibres
    would have been pressed, ink and blood rubbed into the edge. This looked
    arranged.\" (manuscript s-003, L23-L24); narrator states conclusion: \"The
    scrap was put there after the fact.\" (manuscript s-003, L26)"
first_seen: s-001
