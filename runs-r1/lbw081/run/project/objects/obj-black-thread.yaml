id: obj-black-thread
sketch: A length of thin black thread (waxed linen / monofilament) found tangled
  behind the clock — a small, apparently insignificant physical clue that ties
  into mechanical timing.
notes:
  - .writer/drafts/s-001.md L100-L120
  - "Observed in s-002: a length of black thread, waxed and stiff, tucked behind
    the inner brass and snagged on a small screw at the base; a thin line of
    dust lay above it and the wood below was cleaner, as if brushed in haste.
    Provenance: .writer/drafts/s-002.md L7-L9"
  - "\"At the base the black thread hung where I'd seen it: waxed, stiff,
    snagged on a screw. I followed its line: it looped and ran up toward the
    movement and vanished behind the plates. That was no stray sewing fibre;
    laid like that it could be a patient little mechanism, a thing that might
    nudge a wheel at an appointed minute.\" (manuscript s-003, L7-L9)"
  - >-
    "The waxed black thread that had been threaded into the movement ran into
    that cavity and was fastened to a small bent bracket on the gun's
    trigger-guard." (manuscript .writer/drafts/s-004.md L5-L5)


    Recorded: thread runs from movement into cavity and is attached to a small
    bent bracket fastened to the gun's trigger-guard (provenance s-004 L5).
first_seen: s-001
