id: obj-envelope
sketch: A sealed envelope found on Lucius's desk containing a terse typed threat
  about an upcoming sale; the handwriting on the flap is later compared to
  suspects.
notes:
  - "Observed in s-002: sealed envelope with shallow diagonal crease across the
    flap; typed line visible through thin paper reading “DO NOT SELL THE IVORY
    REVOLVER. THIS IS YOUR LAST WARNING.” Provenance: .writer/drafts/s-002.md
    L13-L16"
  - "\"The tech at the desk tapped the envelope's diagonal crease with a latexed
    fingertip. 'We lifted a partial print from the flap's crease,' he said.
    'Preliminary lift consistent with Iris Harben.'\" (manuscript s-003, L31);
    also noted in summary of scene: \"an envelope that now carried a lifted
    print.\" (manuscript s-003, L35)"
first_seen: s-002
