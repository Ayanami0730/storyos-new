id: char-gul
name: gul
sketch: Gul, a charismatic trader in Port Rahim who recognizes the peri token
  and warns Amina of the council's patience and reach.
identity:
  appearance: '"He himself was small-boned, quick-eyed, and given to a half-smile
    that stopped just short of friendship."'
  stall_setup: "\"Gul's stall sat on the end of a row, the kind of neat jumble
    that read like an advertisement for careful hands. Under a patched blue
    awning his wares hung on hooks and lines above a low counter of crates.
    Gul's stall was a neat jumble of brass trinkets, sea-glass, folded maps, and
    jars of preserved lemons.\""
  trades: '"Brass trinkets, sea-glass, folded maps, preserved lemons"'
provenance:
  appearance: s-002
  stall_setup: s-002
  trades: s-002
