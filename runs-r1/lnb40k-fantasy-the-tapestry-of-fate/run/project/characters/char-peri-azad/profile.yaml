id: char-peri-azad
name: peri-azad
sketch: Azad, a senior member of the Peri Council who speaks for them. Charming,
  cold, and ceremonial; he is the council's interlocutor with mortals and the
  face of its coercion.
identity:
  wing_description: silver-edged, length of a master's cloak
  demeanor: charming, ceremonial; speaks with honeyed threat
  quote: '"Captain Amina al-Sirafi," he said, ringed fingers making a courteous
    arc, "the Peri Council chooses you."'
provenance:
  wing_description: s-003
  demeanor: s-003
  quote: s-003
