id: char-amina-ghost
name: amina-ghost
sketch: An apparition of Amina's late sibling (a memory-ghost that appears in
  dreams and in the island's mirrors). It is part memory, part enchantment, and
  a voice that tempts and tests her.
identity:
  nature: '"The ghost in the marrow, a soft pressure at the back of her teeth like
    a thumb on a string. Hold the line, Mina, the voice said as plainly as a
    hand on her shoulder."'
  memory_ghost_phrase_repeated: Hold the line, Mina.
  visibility_to_others: private_to_amina_only
provenance:
  nature: s-002
  memory_ghost_phrase_repeated: s-003
  visibility_to_others: s-007
