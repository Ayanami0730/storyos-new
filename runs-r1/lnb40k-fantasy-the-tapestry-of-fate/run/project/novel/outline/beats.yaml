    chapter: ch-07
    intent: "The heist: Amina attempts to take the spindle from the Heart-loom.
      Alarmed witches and shifting corridors force her into desperate choices;
      she must rely on guile and what she has learned of the island's bargains
      to seize the spindle."
    present:
      - char-amina
      - obj-spindle
      - faction-witches-island
      - loc-island-jarrah
      - obj-peri-amulet
      - char-witch-lailah
