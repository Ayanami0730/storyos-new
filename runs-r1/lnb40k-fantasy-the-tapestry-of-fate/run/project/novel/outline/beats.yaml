    chapter: ch-07
    intent: Onboard the Qitaf, a crew member (Rasim) succumbs to the island's call
      and is taken or altered. Yusuf fights to save him, drawing the peri's
      anger. The crew's peril becomes a pressing, immediate cost that pushes
      Amina toward a decision.
    present:
