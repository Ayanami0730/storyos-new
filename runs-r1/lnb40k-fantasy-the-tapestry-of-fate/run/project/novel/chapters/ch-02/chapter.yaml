chapter: ch-02
scenes:
  - id: s-005
    intent: The Qitaf departs. Amina narrates the sea journey, the amulet's thrum as
      Azraq keeps watch via satellite-like sightings, and the crew's nervousness
      as they approach the island's known coordinates. The island's name hangs
      in the fog long before sighting.
    present:
      - char-amina
      - loc-ship-qitaf
      - char-yusuf
      - char-rasim
      - faction-peri-council
      - loc-island-jarrah
      - obj-peri-amulet
  - id: s-006
    intent: "First strange weather: the sea folds wrong and navigation instruments
      fail. Amina recognizes patterns like those in the wreck log; the island's
      enchantment reaches for the ship even before they sight land. The folio
      map's marginalia echoes what they experience."
    present:
      - char-amina
      - char-rasim
      - loc-ship-qitaf
      - obj-ship-log-wreck
      - obj-folio-map
      - loc-island-jarrah
  - id: s-007
    intent: They salvage a drifting lifeboat and a tattered log from a wreck; the
      journal's last entries describe a coastline that rearranged itself and a
      woman who 'learned to listen' to the island — planting the seed that the
      witches reweave paths.
    present:
      - char-amina
      - loc-ship-qitaf
      - obj-ship-log-wreck
      - loc-island-jarrah
      - obj-folio-map
  - id: s-008
    intent: "Azraq reasserts the Peri Council's control: he demonstrates the
      amulet's bite on Amina when she balks and describes the council's interest
      in the spindle — subtly implying motives that will later matter. Stakes
      are sharpened."
    present:
      - char-amina
      - char-peri-envoy-azraq
      - obj-peri-amulet
      - loc-ship-qitaf
      - faction-peri-council
      - obj-spindle
