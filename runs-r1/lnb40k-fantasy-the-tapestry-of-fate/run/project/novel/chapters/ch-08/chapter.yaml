  - id: s-030
    intent: "Climax: Amina confronts Azad and the Peri Council. In a final exchange
      she uses the spindle in a creative, costly way—not to erase the Council
      but to reweave the nature of bargains so that coercion loses its
      immortality. The council pays a price."
