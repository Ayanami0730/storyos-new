scenes:
  - id: s-029
    intent: "The rewrite works partially: the token loosens but the island's weave
      frays. Laila returns but altered: her memories are shuffled, and the crew
      carry small losses. The peri are enraged and reveal they intended
      sacrifice; Amina has changed the terms but not the balance."
