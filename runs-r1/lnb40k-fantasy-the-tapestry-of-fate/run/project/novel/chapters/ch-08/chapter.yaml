  - id: s-031
    intent: "Aftermath: The island stabilizes as the witches reweave with Mother
      Khayla's guidance; Elif helps restore what can be restored. Amina's crew
      is free but altered. The peri are changed: their compulsion weakens, and
      the token is neutralized but at a moral cost."
