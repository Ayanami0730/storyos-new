  - id: s-032
    intent: "Resolution: Back in Port Rahim, Amina contemplates what freedom now
      means. She returns the spindle to the witches or leaves it in a guarded
      place by agreement; she no longer serves the peri. Seeds of future tension
      remain, but Amina is restored in a new, ambiguous freedom."
