    intent: Amina meets Lailah unexpectedly at a weir of stitched reeds. Lailah is
      polite, curious, and probes Amina's motives. She warns that the island
      takes as much as it gives and mentions the Heart-loom and the spindle, but
      offers ambiguous aid.
