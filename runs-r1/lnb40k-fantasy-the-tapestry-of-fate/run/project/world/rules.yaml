note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - Peri are effectively immortal and powerful, but they are bound by oaths,
    covenants, and the binding artifacts they make; they cannot simply will away
    mortal free will without legalistic or talismanic devices.
  - "Isle Jarrah is subject to the witches' fate-weaving: ordinary physical exit
    is barred by the island's enchantments. Leaving is possible only through
    specific bargains, rituals, or by altering the island's weaving from
    within."
  - "The Spindle can rewrite individual strands of fate — it can alter
    probabilities, choices, and the course of a single life-line — but every
    stitch or unpicking requires an exact metaphysical cost: something
    equivalent must be unmade, taken, or exchanged. It cannot resurrect the
    truly dead nor change cosmic constants."
  - Bargains, names and promises have power. Spoken deals (explicit bargains)
    made in the island's terms are binding and will be enforced by the island
    and its practitioners; breaking an explicit bargain creates supernatural
    consequences.
  - "The Peri binding amulet enforces compliance but is not absolute: it can be
    resisted by strong mortal will, counter-magic from the witches, or by using
    the Spindle under the island's rules — each of those options will carry
    costs and tradeoffs."
  - "Magic in this world preserves a balance: gains require losses, and
    shortcuts to absolute gain (immortality, absolute control of many lives) are
    blocked by the weave of the world. Characters may negotiate or reroute the
    balance, but they cannot create value ex nihilo."
