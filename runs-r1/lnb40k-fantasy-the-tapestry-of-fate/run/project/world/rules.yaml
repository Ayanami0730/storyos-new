note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - Peri are immortal and can bind mortals with tokens that enforce obedience in
    graduated stages; the token cannot be destroyed by ordinary means but can be
    'unbound' by specific fate-work.
  - "The Spindle can rewrite fate only in precise, threadlike edits. Every
    change demands a proportional cost: a memory, a bond, a trade of consequence
    that cannot be fabricated."
  - The Island of Qarrah enforces inescapability by altering memory, geography,
    and perception; physical exit is possible only when memory-anchors remain or
    fate-work alters the island's weave.
  - Witches of Qarrah practice confined fate-work (repairs and calibrations) and
    guard artifacts. They will not allow wholesale erasure of whole peoples or
    broad cosmic retcons.
  - Peri bargains are durable across time; their enforcement is metaphysical and
    not subject to mortal courts, but the principles of exchange (offer,
    counteroffer, price) are consistent and can be exploited by skilled
    fate-work.
  - "Magic has rules and friction: artifacts like the Spindle are not
    omnipotent; the more ambitious the rewrite, the more localized and invasive
    the cost. Miracles are narrow and expensive."
