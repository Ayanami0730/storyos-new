id: obj-folio-map
sketch: "A battered folio map — a worn set of sailors' notes and marginalia
  about the island: contradictory, fragmentary, and one of Amina's practical
  resources."
notes:
  - A folded folio/map presented aboard the Qitaf by Azraq in s-001; described
    as associated with a wreck near Isle Jarrah. No quoted marginalia are
    recorded.
  - "Physical condition observed in s-004: handled heavily; coastline softened
    by smudges; crosses darkened into blurs; pencil lines degrade from confident
    to scrawl (provenance: s-004). No marginalia verbatim recorded."
  - "Present aboard the Qitaf during the voyage (s-005) and consulted; physical
    condition recorded in s-004: handled heavily; coastline softened by smudges;
    crosses darkened into blurs; pencil lines degrade from confident to scrawl."
first_seen: s-001
