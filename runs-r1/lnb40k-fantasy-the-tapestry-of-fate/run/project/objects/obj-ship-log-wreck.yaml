id: obj-ship-log-wreck
sketch: Wreck log — a torn journal plucked from a wrecked vessel near Jarrah;
  contains desperate entries and a smudged diagram that suggest the island's
  traps and the fate-loom's centrality.
notes:
  - A torn ship's log presented aboard the Qitaf by Azraq in s-001; Azraq stated
    it had been recovered from a wreck near Isle Jarrah. No quoted text from the
    log is recorded.
  - "Physical condition observed in s-004: folded smaller and worse for the sea;
    diagram eaten by a torn edge; words bled at margins and smudged (provenance:
    s-004). No quoted wreck-log text was invented or recorded."
  - "Present aboard the Qitaf during the voyage (s-005) and consulted; physical
    condition recorded in s-004: folded smaller and worse for the sea; diagram
    eaten by a torn edge; words bled at margins and smudged."
first_seen: s-001
