id: obj-peri-amulet
sketch: Peri binding amulet — a silver-blue sigil Azraq fastens to Amina, which
  enforces the Peri Council's command and signals their watch. It hurts to
  resist; it can be countered only by certain magics or bargains.
notes:
  - Presented and fastened to Amina by Azraq aboard the Qitaf in s-001; enforces
    compliance and punishes resistance as described in scene s-001.
first_seen: s-001
