id: loc-parlor-reflection
sketch: The mirror-reflected parlor space — the other-side room visible within
  the Venetian mirror. Exhibits inverted geometry (stair orientation reversed)
  and colder bluish light; acts as the location Lena is confined to after the
  exchange.
notes:
  - 'Created to record the reflected space Lena experiences when trapped inside
    the mirror (scene s-004). Quote provenance: "I was looking at the parlor
    from the wrong side of everything: from behind the glass where the light was
    colder and the stair went the other way. My hands were pale, pressed to the
    inside of the mirror; they were me and not-me..."'
first_seen: s-004
