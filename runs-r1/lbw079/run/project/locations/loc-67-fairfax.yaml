id: loc-67-fairfax
sketch: "67 Fairfax: a narrow, three-story Victorian rental house with a
  variable smell of boiled tea and old paper; creaky stairs and thin walls. The
  house is a character in itself, with an attic that still smells of dust and
  varnish."
notes:
  - Described as having a constant, faint smell of boiled tea and old paper;
    stairs that complain in different keys and thin walls that let hall sound
    through.
