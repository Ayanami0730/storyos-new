id: loc-parlor
sketch: The front parlor on the ground floor of Holloway House. Large windows,
  faded wallpaper, and the antique Venetian mirror mounted above the mantel.
notes:
  - 'Measurements and provenance (scene s-001): "The parlor took my boxes with
    the same measured indifference: a long room with tall windows, faded
    wallpaper, and a mantel that sat four feet off the floor."; "The windows
    faced east; from the mantel to the nearest window opening it was thirteen
    feet, and the mantel’s right edge lay three feet from the east wall where
    the narrow stair rose."; "The Venetian mirror above it was six feet wide by
    four feet tall; its lower edge began three feet above the mantel, so the
    glass started seven feet from the floor."; "In my sketch I wrote the numbers
    in a neat column: mantel 48 in., mirror 72×48 in., mirror bottom +36 in. I
    measured that by eye and with the cheap tape from my toolbox because these
    are the sorts of things that matter later."'
first_seen: s-001
