id: loc-attic
sketch: A small, low-attic above the parlor reached by a narrow stair and locked
  with a brass key; it contains the house’s odd geometry — a shaft of light that
  can fall through a slat under certain angles.
notes:
  - "Attic slat specifics (scene s-003): 'A single slat on the north rafter was
    split from edge to edge and left a vertical gap of about two inches. It sat
    two feet from the hatch and ten feet from the east-facing window; when I
    knelt on the hatch lip a thin shaft of lamp-light threaded through the gap
    and struck the attic floor in a line that aimed back toward the mantel.'
    Source: s-003."
first_seen: s-003
