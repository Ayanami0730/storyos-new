name: mrs-hollis
sketch: "Mrs. Hollis, the house's elderly landlady: small, precise, habit-bound,
  with clipped manners and a patient face whose civility barely conceals
  something worn and practiced."
identity:
  appearance: "She was exactly as you'd expect from her photographs in other
