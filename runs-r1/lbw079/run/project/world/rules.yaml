note: What is true. Not what anyone knows — see characters/<id>/beliefs.jsonl.
rules:
  - "Supernatural effects are bounded and leave physical, reproducible traces:
    scratches, displaced objects, marks on surfaces, temperature changes
    measurable by normal means."
  - Ghosts in this story are anchored to people, objects, or places; they cannot
    teleport away from their anchor or create new anchors ex nihilo.
  - "No retroactive changes to recorded facts or documents: handwriting,
    photographs and stains found in the house were placed there in the past and
    cannot be altered by the ghost once discovered (the ghost can only reveal or
    reproduce marks consistent with existing materials)."
  - The narrator's perceptions are essentially reliable (senses, timestamps,
    recordings are trustworthy) though psychological tension can bias
    interpretation; contradictions must be resolvable by later, physical
    evidence.
  - No time travel, no resurrection of the dead as living persons, and no
    physical impossibilities (e.g., objects do not pass through solid matter
    unless a consistent mechanism is supplied).
  - "Causality holds: every observed effect has a discoverable proximate cause
    within the world (possibly including the ghost's agency), and the reader
    should be able to follow the chain of reasoning from clue to conclusion."
