id: obj-brass-key
sketch: A small brass key found hidden under a loose floorboard in the parlor;
  it opens the attic door.
notes:
  - 'Found under a loose floorboard two feet east of the hearth; provenance
    (scene s-001): "Two feet east of the hearth I found a plank that rode up
    under the heel when I stepped on it. A screwdriver pried the board loose and
    under it lay a small brass key, dull with age but warm from my hand the
    moment I picked it up."'
first_seen: s-001
