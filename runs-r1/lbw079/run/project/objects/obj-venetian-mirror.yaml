id: obj-venetian-mirror
sketch: A large, old Venetian mirror above the parlor mantel. Its silvering has
  a faint, deliberate pattern — thin, almost hairline seams that are not damage
  but part of how it was made. It is the locus for the haunting.
notes:
  - 'Dimensions and provenance (scene s-001): "The Venetian mirror above it was
    six feet wide by four feet tall; its lower edge began three feet above the
    mantel, so the glass started seven feet from the floor."; Mounting: "The
    mirror was nailed to the mantel with old iron brads."; Observed behavior:
    "The reflection followed, but not perfectly. For a fraction of a second the
    glass showed my hand a beat after my hand had moved, as if the mirror were
    watching my gesture through a slow feed."'
  - "Canonical mechanism note added (scene s-004): \"Under symmetric incidence
    at the hairline seam (lamp placed six feet from mantel, flame 18 in above
    hearth, aligned 7 in left of mirror centre, attic-slat beam intersecting),
    the seam functions as a midplane conduit that can exchange embodied presence
    between the reflecting and reflected sides. During s-004 this exchange
    displaced Lena into the mirror-reflected space and placed Hannah into Lena's
    body in the house.\" Source: scene s-004."
first_seen: s-001
