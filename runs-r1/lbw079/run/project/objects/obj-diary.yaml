id: obj-diary
sketch: Hannah Hale’s small, habitually neat diary, written in a fine, cramped
  hand. Tucked behind the mirror. Contains dates, observations about angles of
  light, and a final ambiguous ritual outline.
notes:
  - 'Location and provenance (scene s-001): "Behind it, folded flat against the
    wall, was a small diary: neat, narrow, the sort of book that had been
    written in with a very small, very steady hand."; Contents snippet: "When I
    opened the book the handwriting ran on tight lines about angles and lamps
    and the way a slice of light would travel across the floor in March."'
  - >-
    New provenance and verbatim lines (scene s-002):

    - 1972-03-09: "At the seam the glass receives what the room offers; mark the
    joint and do not let the light strike the wrong edge." 

    - 1972-03-21: "Note the angle at the sill; when the light cuts the sill
    aright the seam answers and will not be denied." 

    Also notes the practical aphorism about midday light. Source: scene s-002.
  - |-
    Added dated verbatim ritual lines (scene s-003, dated March 24, 1972):
    - "Mark the seam." 
    - "Place the flame where the sill is cut." 
    - "Speak her name and give the leaving." 
    Source: s-003.
  - >-
    Added verbatim ritual line (scene s-004, dated March 25, 1972):

    - "March 25, 1972: A leaving asks a taking; the seam will not be satisfied
    without an offered place."

    Source: scene s-004.
first_seen: s-001
