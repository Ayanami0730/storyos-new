id: obj-newspaper-clipping
sketch: A brittle newspaper clipping from 1972 about Hannah Hale’s
  disappearance; includes a photo showing the parlor and the mirror.
notes:
  - 'Bibliographic citation (scene s-002): "Holloway Gazette, mid‑March 1972 —
    photograph of Holloway House. Box 4, Folder 12. Accession HA‑1972‑03."
    Caption line (scene s-002): "March 14, 1972." Photo shows (scene s-002):
    mantel, Venetian mirror with hairline seam across the silvering, tall east
    windows throwing a wedge of light onto the floor.'
first_seen: s-002
