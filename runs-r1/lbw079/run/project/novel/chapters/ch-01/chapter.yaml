chapter: ch-01
scenes:
  - id: s-001
    intent: "Establish voice, the house's texture, and the first uncanny discovery:
      the narrator moves in, converses with Mrs. Hollis about rules and the
      clock, notices the bedroom's wallpaper is freshly patched and finds a
      silver locket tucked in the gap. The scene demonstrates the story's rules
      (physical traces, anchored ghost) by making the locket a tangible,
      provenance-bearing object."
    present:
      - char-narrator
      - char-mrs-hollis
      - loc-67-fairfax
      - loc-bedroom-2
      - obj-silver-locket
      - obj-cracked-mirror
      - obj-sepia-photo
      - obj-broken-clock
      - obj-wallpaper
  - id: s-002
    intent: "Escalate: the narrator experiences small, reproducible phenomena —
      footsteps above at precise times, damp chalk marks on the attic hatch, and
      the faint skitter of a doll in the walls. She explores the attic, finding
      Elsie's diary, the porcelain doll, and the loose floorboard with a hidden
      stash; physical evidence begins to form a puzzle that points to a withheld
      past."
    present:
      - char-narrator
      - char-elsie
      - loc-attic
      - obj-diary
      - obj-porcelain-doll
      - obj-chalk
      - obj-floorboard-plank
      - obj-sepia-photo
  - id: s-003
    intent: "Increase stakes and logic: the narrator attempts methodical tests to
      rule out hallucination — she records sound, timestamps the stopped clock,
      photographs the marks, and compares handwriting. Mrs. Hollis offers
      evasions that raise suspicion. The scene must show the ghost's limitations
      (anchored, repetitive) and produce a clew: a date and initial on the
      locket/photo and a stain under the plank that matches a description in the
      diary."
    present:
      - char-narrator
      - char-mrs-hollis
      - loc-hallway
      - loc-kitchen
      - obj-broken-clock
      - obj-diary
      - obj-silver-locket
      - obj-cracked-mirror
      - obj-sepia-photo
  - id: s-004
    intent: "Climax and payoff: the narrator confronts the house's secret using the
      collected physical evidence (the torn diary page, the locket's initials,
      the stain beneath the floorboard) to force a confession — either from Mrs.
      Hollis or from a trail of facts that explain Elsie's death. The ghost's
      actions escalate in response but remain consistent: she can only repeat
      what she knew in life and can make small, physical demonstrations. The
      scene ends with a chilling, logically explained closure that leaves an
      intense, terrifying afterimage rather than an arbitrary supernatural
      twist."
    present:
